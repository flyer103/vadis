[package]
name = "router-conformance"
version.workspace = true
edition.workspace = true

# The CONF case table = DESIGN §12.8. Unimplemented paths always carry #[ignore = "CONF-NN: depends on <item>"] (explicitly visible, not simply absent).

[dependencies]
router-core = { path = "../../crates/router-core" }
# The testkit's mock upstream needs an async runtime (CONF-01…CONF-14);
# declared as a normal dependency because it lives in the lib target.
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# CONF-25 drives the real `serve` assembly (lib target) in-process;
# CONF-20..23 drive the real SQLite store.
router-cli = { path = "../../crates/router-cli" }
router-store = { path = "../../crates/router-store" }
