[package]
name = "vadis-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The one local SQLite/WAL store (event log + projections) and the JSONL trace sink; the only writer of the state database."
license.workspace = true
repository.workspace = true

[dependencies]
vadis-core = { path = "../vadis-core" }
serde_json = { workspace = true }
# rusqlite (bundled): the ONLY crate whose §12.1 allowlist row names it
# (DESIGN §12.10.4) — "vadis-store is the only writer" is structural, not
# a discipline claim. "bundled" pins the libsqlite3 C library into the build
# (accepted knowingly, ADR-009's consequences; rationale in the commit that
# adds this dependency).
rusqlite = { workspace = true }
