[package]
name = "vadis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `vadis` executable: config loading and the `serve` command (the only subcommand in v0.1)."
license.workspace = true
repository.workspace = true

[[bin]]
name = "vadis"
path = "src/main.rs"

[dependencies]
vadis-core = { path = "../vadis-core" }
vadis-proxy = { path = "../vadis-proxy" }
vadis-providers = { path = "../vadis-providers" }
vadis-store = { path = "../vadis-store" }
# vadis-plugins: the composition point of the crate graph (§12.1 — it
# sits beside vadis-core, so nothing below the CLI may import it). serve
# loads the `builtin/transform_rules` engine from the configured rule file
# (spec §4.4); the engine edits nothing unless the request asked (I3).
vadis-plugins = { path = "../vadis-plugins" }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# serde_yaml: parses the spec §4 config file (config.example.yaml). Outside
# the §12.1 allowlist by necessity — no allowlisted crate parses YAML; it is
# added to vadis-cli only (config file I/O lives here per §12.10.2), never
# to vadis-core, so the domain crate's dependency set stays within bounds.
serde_yaml = "0.9"
# futures: the serve endpoint maps the SSE relay stream into axum's body
# (the SSE relay); allowlisted alongside vadis-providers/vadis-proxy.
futures = { workspace = true }
# notify: DESIGN §12.1's allowlist row for vadis-cli only (ADR-039) — the
# reload's file-watch mechanism. The watcher decides when to look; the byte
# digest decides whether anything changed. No second watch-related crate is
# taken (ADR-040 D12.3): the coalescing window is a constant in the reload's
# own module, not a dependency (`notify-debouncer-full` refused).
notify = { workspace = true }
