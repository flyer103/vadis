[package]
name = "router-store"
version.workspace = true
edition.workspace = true

[dependencies]
router-core = { path = "../router-core" }
serde_json = { workspace = true }
# rusqlite (bundled): the ONLY crate whose §12.1 allowlist row names it
# (DESIGN §12.10.4) — "router-store is the only writer" is structural, not
# a discipline claim. "bundled" pins the libsqlite3 C library into the build
# (accepted knowingly, ADR-009's consequences; rationale in the commit that
# adds this dependency).
rusqlite = { workspace = true }
