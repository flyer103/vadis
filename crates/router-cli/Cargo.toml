[package]
name = "router-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `router` executable: config loading and the `serve` command (the only subcommand in v0.1)."
license.workspace = true
repository.workspace = true

[[bin]]
name = "router"
path = "src/main.rs"

[dependencies]
router-core = { path = "../router-core" }
router-proxy = { path = "../router-proxy" }
router-providers = { path = "../router-providers" }
router-store = { path = "../router-store" }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# serde_yaml: parses the spec §4 config file (config.example.yaml). Outside
# the §12.1 allowlist by necessity — no allowlisted crate parses YAML; it is
# added to router-cli only (config file I/O lives here per §12.10.2), never
# to router-core, so the domain crate's dependency set stays within bounds.
serde_yaml = "0.9"
# futures: the serve endpoint maps the SSE relay stream into axum's body
# (the SSE relay); allowlisted alongside router-providers/router-proxy.
futures = { workspace = true }
