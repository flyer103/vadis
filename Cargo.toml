[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/router-protocol",
    "crates/router-providers",
    "crates/router-runtime",
    "crates/router-plugins",
    "crates/router-proxy",
    "crates/router-plugin-sdk",
    "crates/router-cli",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# 依赖白名单 = DESIGN §12.1。新增依赖必须先对齐白名单并在 commit message 写明理由。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
