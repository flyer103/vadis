[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/router-protocol",
    "crates/router-providers",
    "crates/router-runtime",
    "crates/router-plugins",
    "crates/router-proxy",
    "crates/router-plugin-sdk",
    "crates/router-cli",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# The dependency whitelist = DESIGN §12.1. New dependencies must first be reconciled against the whitelist, with the rationale stated in the commit message.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
