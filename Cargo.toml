[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/router-protocol",
    "crates/router-providers",
    "crates/router-runtime",
    "crates/router-plugins",
    "crates/router-proxy",
    "crates/router-plugin-sdk",
    "crates/router-cli",
    "crates/router-store",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flyer103/router"

# The dependency whitelist = DESIGN §12.1. New dependencies must first be reconciled against the whitelist, with the rationale stated in the commit message.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
# rusqlite (bundled SQLite): DESIGN §12.1's allowlist names it for router-store
# only (ADR-009 item 1) — the single crate that may open the state database.
# "bundled" compiles the pinned libsqlite3 C library in, so the build does not
# depend on a system SQLite (ADR-009's consequences accept the bundled C lib).
rusqlite = { version = "0.40", features = ["bundled"] }
# reqwest / bytes / http: DESIGN §12.1's allowlist row for router-providers
# (reqwest, tokio, futures). http + bytes are reqwest's own foundation types,
# pulled in explicitly so the adapter API names them without depending on
# reqwest's re-exports staying stable.
# `rustls-tls` is **load-bearing**: every real provider is https, and an
# http-only client fails every upstream call instantly (found by the live
# client smoke — the offline conformance mocks are plain http, so they cannot
# catch it). Keep a TLS feature here or the data plane cannot reach a provider.
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
http = "1"
bytes = "1"
# futures: named in the same allowlist row (the SSE tee lands with R2-2e).
futures = "0.3"
