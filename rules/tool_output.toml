# router 输入侧压缩规则 / rules/tool_output.toml
#
# 契约：形态对齐 ADR-003（rtk 风格声明式管线：管线阶段 / match_output / keep·strip lines /
#       truncate / head·tail / max_lines / on_empty）+ spec §4 的 transform_rules 插件。
#       本文件是**规则文件的落地格式**：实现方按此写 `builtin/transform_rules` 的解析器。
#
# ── 硬约束（违反即为 bug，不是"风格问题"）──────────────────────────────────────────────
# 1. 内容确定性：规则是 `(content, stable config)` 的纯函数。禁读轮次/时钟/随机数/环境；
#    规范化掉"易变时间戳"是允许且鼓励的（同内容 → 同上游字节 → 前缀缓存可复用）。
# 2. 只作用于工具/环境载荷，**绝不改写用户意图**（ADR-003；第三方实测显示压缩人类 prompt 会让
#    模型答得更长更差）。规则选择靠 `match_tool` / `match_kind`，不靠"猜内容"。
# 3. fail-safe：规则装载失败、正则编译失败、`json_compact` 解析失败、内联测试失败
#    → 该条规则**不生效**，载荷原样通过，trace 记 `transform_error`（spec §8）。
# 4. 不得包含真实密钥、私有代码片段、真实客户数据。示例载荷一律是构造数据。
# 5. 计账：本文件只描述"怎么改"；省了多少 token 由引擎按 spec §6 逐条记账，`verified` 与
#    `inferred` 不得混用（ADR-003）。
#
# ── 语义规范（实现必须逐条对齐，否则内联测试会失败）────────────────────────────────────
# 选规则：文件名/节名 = 规则 id；`match_tool`（正则，匹配工具名）与 `match_kind`（载荷类别声明）
#         均为选填，同时给出时**必须都满足**；都不给 = 通配（默认不推荐）。
# 前置条件：`min_input_bytes` 不满足 → 整条规则不生效，载荷逐字节原样通过（含其原有换行）。
# 阶段顺序（固定，不可配置）：strip_ansi → json_compact → replace → match_output
#         → strip_lines_matching | keep_lines_matching → truncate_lines_at → tail_lines
#         → max_lines → tee 标记 → on_empty。
# 行语义：载荷去掉**末尾一个**换行后按 `\n` 切分（`a\nb\n` → 2 行，`a\n\n` → ["a", ""]）；
#         非空输出 = 各行 join("\n") + **恰好一个**末尾 "\n"；结果 0 行 → 输出 `on_empty`
#         字面量（不加换行），且**不**追加 tee 标记。
# 各阶段：
#   strip_ansi          ：去掉 ANSI 转义序列（ESC[ ... m 等）。
#   json_compact        ：序保留解析后压成单行（`,`/`:` 之间无空白），**数字字面量原样保留**，
#                         输出为单行 + 末尾换行；解析失败 → 整条规则不生效（fail-safe）。
#   replace             ：逐行 replace_all（数组顺序即应用顺序）。
#   match_output        ：对**全量文本**匹配；首个命中即短路返回 `message`（不加换行）；
#                         `unless` 命中则跳过该条。
#   strip/keep_lines    ：逐行正则；两者互斥（同时出现 = 装载失败）。
#   truncate_lines_at   ：行内容超过 N 个字符 → 保留前 N 个字符并追加 `...`（`...` 不计入 N）。
#   tail_lines          ：保留末 N 行。max_lines：保留前 N 行。均在截断之后应用。
#   tee 标记            ：`lines_dropped > 0` 且 `tee = true` 时，在输出末尾追加一行
#                         `[router:tee sha256=<原始载荷 sha256 前 16 位 hex> lines_dropped=<n> bytes_original=<n>]`
#                         （原始载荷 = 进入本规则的原始字节，UTF-8，含其换行；
#                           lines_dropped = 原始行数 − 输出行数，被 strip 掉的行也计入）。
#                         tee 是规则级声明（spec §4.4）；原文存储与 retrieve 通道 v0.1 不实现
#                         （spec §4.4 已标注为未实现，本文件不得虚构落盘目录或端点）。
# 查找与准入：`.router/rules.toml`（项目）→ `~/.config/router/rules.toml`（用户）→ 内置（编译期内嵌）；
#         首个命中生效（ADR-003「三级覆盖」）。`router rules verify` 跑全部内联测试：任一规则测试失败
#         → 该规则不装载并在启动日志与 `/health` 报出，其余规则照常（trust 门：ADR-008 裁定 v0.1 不启用，
#         触发重新评估的条件写在该 ADR 里）。
# 内联测试：`[[tests.<规则 id>]]`，`name` / `input` / `expected` 三者必填；字符串用**字面字符串**
#         （`'...'` / `'''...'''`，不处理转义），需要 ANSI/`\n` 等转义时用基本字符串（`"..."`）。
#         多行字面字符串：紧接 `'''` 的首个换行被裁剪，其余字节（含末尾换行）原样保留。
#         本文件的 13 条内联测试已用等价语义的模拟器（一次性脚本，不入库）逐条验过：13/13 通过。
#         Rust 实现必须得到同样结果 —— 不一致时先怀疑实现，再怀疑规范文字。

schema_version = 1

# ── 规则 1：JSON 工具载荷 ──────────────────────────────────────────────────────────────
# 场景：MCP / Bash 返回的 JSON 带缩进（每行 2-4 空格），压缩成单行可省下大量空白 token，
#       且语义完全不变。短载荷不处理：加上 tee 标记反而净亏，故设 min_input_bytes。

[filters.tool-result-json]
description = "JSON 工具载荷：序保留压成单行；短载荷与非法 JSON 原样通过"
match_kind = ["json"]
min_input_bytes = 32
json_compact = true

[[tests.tool-result-json]]
name = "pretty JSON 压成单行，键序与数字字面量不变"
input = '''
{
  "total": 3,
  "hits": [
    {"path": "a.rs", "line": 12},
    {"path": "b.rs", "line": 40}
  ]
}
'''
expected = '''{"total":3,"hits":[{"path":"a.rs","line":12},{"path":"b.rs","line":40}]}
'''

[[tests.tool-result-json]]
name = "短于 min_input_bytes：整条规则不生效，逐字节原样"
input = '{"a":1}'
expected = '{"a":1}'

[[tests.tool-result-json]]
name = "非法 JSON：按 spec §8 回退原文（fail-safe，不抛错、不半改）"
input = '{"a": 1,, "b": 2, "note": "padding for the byte budget guard"}'
expected = '{"a": 1,, "b": 2, "note": "padding for the byte budget guard"}'

# ── 规则 2：构建 / 测试日志 ────────────────────────────────────────────────────────────
# 场景：Bash 工具跑构建或测试，输出里 80% 是进度行与空行。保留诊断与摘要。
#       `replace` 把易变耗时（`in 2.31s`）规范化掉 —— 这一条同时是"前缀稳定"手段：
#       同一命令两次运行的上游可见字节因此完全一致。

[filters.bash-log-noise]
description = "构建/测试日志：去进度行与空行、剥离 ANSI、规范化耗时；无输出给占位串"
match_kind = ["log", "text"]
match_tool = '^(Bash|bash|shell|run_terminal_cmd)$'
strip_ansi = true
replace = [
  { pattern = '\s+in \d+(\.\d+)?s$', replacement = '' },
]
strip_lines_matching = [
  '^\s*$',
  '^\s*(Compiling|Checking|Downloading|Downloaded|Building|Installing|Fresh)\b',
  '^\s*\[ *\d+%\]',
]
truncate_lines_at = 240
max_lines = 200
on_empty = "<bash: no output>"

[[tests.bash-log-noise]]
name = "去进度行与空行，保留诊断与摘要"
input = '''
   Compiling serde v1.0.210
[ 62%] Building object
warning: unused variable: `x`
 --> src/lib.rs:12:9
   Compiling router-core v0.1.0

error[E0308]: mismatched types
 --> src/main.rs:3:5

error: could not compile `router` due to 1 previous error
'''
expected = '''warning: unused variable: `x`
 --> src/lib.rs:12:9
error[E0308]: mismatched types
 --> src/main.rs:3:5
error: could not compile `router` due to 1 previous error
'''

[[tests.bash-log-noise]]
name = "全是噪声 → on_empty"
input = '''
   Compiling serde v1.0.210

[ 91%] Building router-cli
'''
expected = '<bash: no output>'

[[tests.bash-log-noise]]
name = "ANSI 颜色码先剥离"
input = "\u001B[31merror\u001B[0m: cannot find value `y` in this scope\n"
expected = "error: cannot find value `y` in this scope\n"

[[tests.bash-log-noise]]
name = "replace：规范化易变耗时（同命令两次运行字节一致）"
input = "    Finished `dev` profile [unoptimized + debuginfo] target(s) in 2.31s\n"
expected = "    Finished `dev` profile [unoptimized + debuginfo] target(s)\n"

# ── 规则 3：搜索结果 ──────────────────────────────────────────────────────────────────
# 场景：`grep -C 3` 的输出里命中行只占少数。只留命中行（`path:line:`）与分组分隔（`--`）。
#       超出预算时截断，并 tee 原文，使模型仍可取回被丢掉的部分。

[filters.grep-hits-budget]
description = "搜索结果：只留命中行与分组分隔，超预算截断并 tee 原文"
match_kind = ["text"]
match_tool = '^(Grep|grep|rg|ripgrep|search)$'
keep_lines_matching = ['^\S+:\d+:', '^--$']
max_lines = 8
tee = true
on_empty = "<grep: no hits kept>"

[[tests.grep-hits-budget]]
name = "丢掉上下文行（`-` 分隔），保留命中行与 `--`"
input = '''
src/a.rs-10-  fn unrelated() {
src/a.rs-11-  }
src/a.rs:12:let x = foo();
src/a.rs-13-  trailing context
--
src/b.rs:7:foo();
'''
expected = '''src/a.rs:12:let x = foo();
--
src/b.rs:7:foo();
[router:tee sha256=ed614df208e96092 lines_dropped=3 bytes_original=126]
'''

[[tests.grep-hits-budget]]
name = "超出 max_lines：截断到前 8 行并 tee 原文"
input = '''
src/a.rs:1:let r = foo(1);
src/a.rs:2:let r = foo(2);
src/a.rs:3:let r = foo(3);
src/a.rs:4:let r = foo(4);
src/a.rs:5:let r = foo(5);
src/a.rs:6:let r = foo(6);
src/a.rs:7:let r = foo(7);
src/a.rs:8:let r = foo(8);
src/a.rs:9:let r = foo(9);
src/a.rs:10:let r = foo(10);
src/a.rs:11:let r = foo(11);
src/a.rs:12:let r = foo(12);
'''
expected = '''src/a.rs:1:let r = foo(1);
src/a.rs:2:let r = foo(2);
src/a.rs:3:let r = foo(3);
src/a.rs:4:let r = foo(4);
src/a.rs:5:let r = foo(5);
src/a.rs:6:let r = foo(6);
src/a.rs:7:let r = foo(7);
src/a.rs:8:let r = foo(8);
[router:tee sha256=fd062073dd793ae1 lines_dropped=4 bytes_original=330]
'''

[[tests.grep-hits-budget]]
name = "无命中行保留 → on_empty（且不追加 tee 标记）"
input = '''
src/a.rs-10-  fn unrelated() {
src/a.rs-11-  }
'''
expected = '<grep: no hits kept>'

# ── 规则 4：diff 载荷 ─────────────────────────────────────────────────────────────────
# 场景：agent 常把整段 patch 贴回上下文。删掉 `index ...` 这类对模型无用的行，超长行截断，
#       总量封顶后 tee 原文。truncate_lines_at 示例值偏小（60）以便内联测试可读；生产可为 160–400。

[filters.diff-budget]
description = "diff 载荷：删 index 噪声行、超长行截断、总量封顶并 tee 原文"
match_kind = ["diff"]
truncate_lines_at = 60
max_lines = 6
tee = true
strip_lines_matching = ['^index [0-9a-f]{7,}\.\.[0-9a-f]{7,}']
on_empty = "<diff: no hunk kept>"

[[tests.diff-budget]]
name = "超长行截断：保留前 60 个字符并追加 ...（不掉行，故无 tee 标记）"
input = '''
+ src/aaaaaaaa/bbbbbbbbbbbbbbbb/cccccccccc/mmmmmmmmmmmm/nnnnnnnnnn.rs
'''
expected = '''+ src/aaaaaaaa/bbbbbbbbbbbbbbbb/cccccccccc/mmmmmmmmmmmm/nnnn...
'''

[[tests.diff-budget]]
name = "先删 index 行再按 max_lines 封顶，并 tee 原文"
input = '''
diff --git a/src/lib.rs b/src/lib.rs
index 1a2b3c4..5d6e7f8 100644
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,3 +1,4 @@ fn main() {
-    let x = 1;
+    let x = 2;
+    let y = 3;
     tail();
'''
expected = '''diff --git a/src/lib.rs b/src/lib.rs
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,3 +1,4 @@ fn main() {
-    let x = 1;
+    let x = 2;
[router:tee sha256=e596ae9c46463f48 lines_dropped=3 bytes_original=190]
'''

[[tests.diff-budget]]
name = "只有 index 噪声行 → on_empty"
input = '''
index 1a2b3c4..5d6e7f8 100644
index 9f8e7d6..5c4b3a2 100644
'''
expected = '<diff: no hunk kept>'
