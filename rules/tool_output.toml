# router input-side compression rules / rules/tool_output.toml
#
# Contract: shape aligned with ADR-003 (rtk-style declarative pipeline:
#            pipeline stages / match_output / keep·strip lines / truncate /
#            head·tail / max_lines / on_empty) + the transform_rules plugin of
#            spec §4. This file is **the landed rule-file format**: implementers
#            write the `builtin/transform_rules` parser against it.
#
# ── Hard constraints (violating any of these is a bug, not a "style issue") ───────────
# 1. Content determinism: a rule is a pure function of (content, stable
#    config). Reading turn number/clock/RNG/environment is forbidden;
#    normalizing away "volatile timestamps" is allowed and encouraged (same
#    content → same upstream bytes → prefix cache reusable).
# 2. Only tool/environment payloads are touched — **never rewrite user intent**
#    (ADR-003; third-party measurements show compressing human prompts makes
#    models answer longer and worse). Rule selection relies on `match_tool` /
#    `match_kind`, never on "guessing content".
# 3. fail-safe: rule load failure, regex compile failure, `json_compact` parse
#    failure, inline-test failure → that rule **does not apply**; the payload
#    passes through verbatim and the trace records `transform_error` (spec §8).
# 4. No real secrets, private code snippets or real customer data. Example
#    payloads are constructed data throughout.
# 5. Accounting: this file only describes "how to change"; how many tokens were
#    saved is accounted per spec §6 by the engine; `verified` and `inferred`
#    must not be mixed (ADR-003).
#
# ── Semantics spec (the implementation must match item by item, otherwise the inline tests fail) ──────
# Rule selection: file/section name = rule id; `match_tool` (regex over the
#         tool name) and `match_kind` (payload category declaration) are both
#         optional; when both are given, **both must match**; neither given =
#         wildcard (not recommended by default).
# Rule order: rules are tried in ascending `order` (an optional integer,
#         default 0; ties broken by id, alphabetical — never by the file's
#         text order, which the loader cannot see). The first rule that
#         both selects and applies wins the node; a rule that selects but
#         does not apply (byte budget unmet, `json_compact` parse failure,
#         `unless` hit) falls through to the next rule.
# Precondition: `min_input_bytes` unmet → the whole rule does not apply; the
#         payload passes through byte-for-byte (including its original
#         newlines).
# Stage order (fixed, not configurable): strip_ansi → json_compact → replace
#         → match_output → strip_lines_matching | keep_lines_matching
#         → truncate_lines_at → tail_lines → max_lines → tee marker
#         → on_empty.
# Line semantics: the payload minus its **final** newline is split on `\n`
#         (`a\nb\n` → 2 lines, `a\n\n` → ["a", ""]); a non-empty output = the
#         lines joined with "\n" + **exactly one** trailing "\n"; zero lines →
#         output the `on_empty` literal (no newline added) and do **not**
#         append the tee marker.
# Stages:
#   strip_ansi          : remove ANSI escape sequences (ESC[ ... m etc.).
#   json_compact        : order-preserving parse then compact to one line (no
#                         whitespace between `,`/`:`); output is a single line
#                         + trailing newline; parse failure → the whole rule
#                         does not apply (fail-safe). **Number spelling: the
#                         value is preserved, the literal is not.** Significand
#                         and decimal forms are kept verbatim (`1.10`, `1.0e-2`,
#                         `9007199254740993`), while an exponent notation is
#                         normalized by serde_json (`1e3` → `1e+3`, `1E3` →
#                         `1e+3`) — the number is unchanged, its spelling is
#                         not. Measured: `autowork/harness/r33-verify/probes/
#                         jsonnum_probe.rs` (`R33-VERIFY-F1`, closed here).
#   replace             : per-line replace_all (array order = application
#                         order).
#   match_output        : matched against the **full text**; the first hit
#                         short-circuits to return `message` (no newline
#                         added); a hit on `unless` skips the rule.
#   strip/keep_lines    : per-line regex; mutually exclusive (both present =
#                         load failure).
#   truncate_lines_at   : lines longer than N characters → keep the first N
#                         characters and append `...` (`...` does not count
#                         toward N).
#   tail_lines          : keep the last N lines. max_lines: keep the first N
#                         lines. Both applied after truncation.
#   tee marker          : when `lines_dropped > 0` and `tee = true`, append
#                         one line at the end of the output:
#                         `[router:tee sha256=<first 16 hex chars of the original payload's sha256> lines_dropped=<n> bytes_original=<n>]`
#                         (original payload = the original bytes entering this
#                         rule, UTF-8, newlines included;
#                         lines_dropped = original line count − output line
#                         count, lines removed by strip included).
#                         tee is a rule-level declaration (spec §4.4); original
#                         storage and the retrieve channel are not implemented
#                         in v0.1 (spec §4.4 already marks them unimplemented;
#                         this file must not invent a storage directory or
#                         endpoint).
# Lookup and admission: `.router/rules.toml` (project) →
#         `~/.config/router/rules.toml` (user) → built-in (compiled in);
#         first hit wins (ADR-003 "three-level override"). `router rules
#         verify` runs all inline tests: any rule whose tests fail → that rule
#         is not loaded and it is reported in the startup log and `/health`;
#         the other rules load as usual (trust gate: ADR-008 rules v0.1 does
#         not enable it; the conditions that trigger re-evaluation are written
#         in that ADR).
# Inline tests: `[[tests.<rule id>]]`; `name` / `input` / `expected` are all
#         required; strings use **literal strings** (`'...'` / `'''...'''`,
#         no escape processing); use basic strings (`"..."`) when ANSI/`\n`
#         escapes are needed. Multi-line literal strings: the first newline
#         immediately after `'''` is trimmed; all remaining bytes (including
#         the trailing newline) are kept verbatim.
#         The 13 inline tests in this file were each verified with a
#         semantically equivalent simulator (a one-off script, not committed):
#         13/13 pass. The Rust implementation must produce the same results —
#         on mismatch, suspect the implementation first and the spec text
#         second.

schema_version = 1

# ── Rule 1: JSON tool payloads ────────────────────────────────────────────────────────
# Scenario: JSON returned by MCP / Bash carries indentation (2-4 spaces per
#       line); compacting it to one line saves a large number of whitespace
#       tokens with semantics completely unchanged. Short payloads are not
#       processed: adding the tee marker would be a net loss, hence
#       min_input_bytes.

[filters.tool-result-json]
description = "JSON tool payloads: order-preserving compaction to one line; short payloads and invalid JSON pass through verbatim"
# Tried before the shell rule: on the live path a Bash payload's kinds are
#       the shell family's (the declared tool→kind table produces no "json"
#       kind for any tool name), so `bash-log-noise` would otherwise select
#       the same payload first and win (R33-F1). A non-JSON payload falls
#       through this rule (`json_compact` parse failure is fail-safe) to
#       `bash-log-noise` unchanged.
order = -1
# The kinds the shell family actually produces (the declared tool→kind
#       table): "json" is producible by no tool name and made this rule
#       unreachable on the live path (R33-F1).
match_kind = ["log", "text"]
min_input_bytes = 32
json_compact = true

[[tests.tool-result-json]]
name = "pretty JSON compacted to one line, key order and number literals unchanged"
input = '''
{
  "total": 3,
  "hits": [
    {"path": "a.rs", "line": 12},
    {"path": "b.rs", "line": 40}
  ]
}
'''
expected = '''{"total":3,"hits":[{"path":"a.rs","line":12},{"path":"b.rs","line":40}]}
'''

[[tests.tool-result-json]]
name = "shorter than min_input_bytes: the whole rule does not apply, byte-for-byte verbatim"
input = '{"a":1}'
expected = '{"a":1}'

[[tests.tool-result-json]]
name = "invalid JSON: fall back to the original text per spec §8 (fail-safe, no throw, no partial edit)"
input = '{"a": 1,, "b": 2, "note": "padding for the byte budget guard"}'
expected = '{"a": 1,, "b": 2, "note": "padding for the byte budget guard"}'

# ── Rule 2: build / test logs ─────────────────────────────────────────────────────────
# Scenario: the Bash tool runs a build or tests; 80% of the output is progress
#       lines and blank lines. Keep diagnostics and summaries.
#       `replace` normalizes away volatile durations (`in 2.31s`) — this is
#       also a "prefix stability" lever: two runs of the same command produce
#       byte-identical upstream-visible output because of it.

[filters.bash-log-noise]
description = "build/test logs: drop progress lines and blank lines, strip ANSI, normalize durations; placeholder when empty"
# R35-1-F1 (R35-2's repair): selection on the wire's own tool name alone,
#       the kind gate lifted. The declared tool→kind table
#       (`router-core/src/transform.rs` TOOL_KINDS) names no client this
#       repository configures — every tool call in the captured traffic is
#       `exec_command` (measured: `autowork/harness/r35-1/corpus-shape.json`,
#       36/36 payload nodes) — so `match_kind` made this rule unreachable on
#       the live path for every client that exists. `match_tool` is the
#       tier-1 selection path (`router-core/src/transform.rs:154-156`), and
#       with both-given-both-must-match the gate can only be lifted by
#       dropping `match_kind` from this rule. The regex keeps the table's
#       hypothetical shell names (their selection is unchanged: they all
#       map to [log, text], which the gate admitted anyway) and declares
#       the observed client vocabulary. `write_stdin` is NOT declared: it
#       is not in the measured vocabulary (stated, not guessed). Scope:
#       the freeze names this rule alone as L2's realiser (R35-1 §D1.1);
#       `tool-result-json` deliberately keeps its declared-kinds selection,
#       so a JSON payload from `exec_command` gets this rule's line
#       filters, not compaction.
match_tool = '^(Bash|bash|shell|run_terminal_cmd|exec_command)$'
strip_ansi = true
replace = [
  { pattern = '\s+in \d+(\.\d+)?s$', replacement = '' },
]
strip_lines_matching = [
  '^\s*$',
  '^\s*(Compiling|Checking|Downloading|Downloaded|Building|Installing|Fresh)\b',
  '^\s*\[ *\d+%\]',
]
truncate_lines_at = 240
max_lines = 200
on_empty = "<bash: no output>"

[[tests.bash-log-noise]]
name = "drop progress lines and blank lines, keep diagnostics and summaries"
input = '''
   Compiling serde v1.0.210
[ 62%] Building object
warning: unused variable: `x`
 --> src/lib.rs:12:9
   Compiling router-core v0.1.0

error[E0308]: mismatched types
 --> src/main.rs:3:5

error: could not compile `router` due to 1 previous error
'''
expected = '''warning: unused variable: `x`
 --> src/lib.rs:12:9
error[E0308]: mismatched types
 --> src/main.rs:3:5
error: could not compile `router` due to 1 previous error
'''

[[tests.bash-log-noise]]
name = "all noise → on_empty"
input = '''
   Compiling serde v1.0.210

[ 91%] Building router-cli
'''
expected = '<bash: no output>'

[[tests.bash-log-noise]]
name = "ANSI color codes stripped first"
input = "\u001B[31merror\u001B[0m: cannot find value `y` in this scope\n"
expected = "error: cannot find value `y` in this scope\n"

[[tests.bash-log-noise]]
name = "replace: normalize volatile durations (two runs of the same command produce identical bytes)"
input = "    Finished `dev` profile [unoptimized + debuginfo] target(s) in 2.31s\n"
expected = "    Finished `dev` profile [unoptimized + debuginfo] target(s)\n"

# ── Rule 3: search results ────────────────────────────────────────────────────────────
# Scenario: in `grep -C 3` output the hit lines are the minority. Keep only hit
#       lines (`path:line:`) and group separators (`--`). When over budget,
#       truncate and tee the original so the model can still retrieve the
#       dropped parts.

[filters.grep-hits-budget]
description = "search results: keep only hit lines and group separators, truncate over budget and tee the original"
match_kind = ["text"]
match_tool = '^(Grep|grep|rg|ripgrep|search)$'
keep_lines_matching = ['^\S+:\d+:', '^--$']
max_lines = 8
tee = true
on_empty = "<grep: no hits kept>"

[[tests.grep-hits-budget]]
name = "drop context lines (`-` separated), keep hit lines and `--`"
input = '''
src/a.rs-10-  fn unrelated() {
src/a.rs-11-  }
src/a.rs:12:let x = foo();
src/a.rs-13-  trailing context
--
src/b.rs:7:foo();
'''
expected = '''src/a.rs:12:let x = foo();
--
src/b.rs:7:foo();
[router:tee sha256=ed614df208e96092 lines_dropped=3 bytes_original=126]
'''

[[tests.grep-hits-budget]]
name = "over max_lines: truncated to the first 8 lines and the original tee'd"
input = '''
src/a.rs:1:let r = foo(1);
src/a.rs:2:let r = foo(2);
src/a.rs:3:let r = foo(3);
src/a.rs:4:let r = foo(4);
src/a.rs:5:let r = foo(5);
src/a.rs:6:let r = foo(6);
src/a.rs:7:let r = foo(7);
src/a.rs:8:let r = foo(8);
src/a.rs:9:let r = foo(9);
src/a.rs:10:let r = foo(10);
src/a.rs:11:let r = foo(11);
src/a.rs:12:let r = foo(12);
'''
expected = '''src/a.rs:1:let r = foo(1);
src/a.rs:2:let r = foo(2);
src/a.rs:3:let r = foo(3);
src/a.rs:4:let r = foo(4);
src/a.rs:5:let r = foo(5);
src/a.rs:6:let r = foo(6);
src/a.rs:7:let r = foo(7);
src/a.rs:8:let r = foo(8);
[router:tee sha256=fd062073dd793ae1 lines_dropped=4 bytes_original=330]
'''

[[tests.grep-hits-budget]]
name = "no hit lines kept → on_empty (and no tee marker appended)"
input = '''
src/a.rs-10-  fn unrelated() {
src/a.rs-11-  }
'''
expected = '<grep: no hits kept>'

# ── Rule 4: diff payloads ─────────────────────────────────────────────────────────────
# Scenario: agents often paste whole patches back into context. Drop lines
#       useless to the model like `index ...`, truncate over-long lines, cap
#       the total then tee the original. The truncate_lines_at example value is
#       small (60) to keep the inline tests readable; production may use
#       160–400.

[filters.diff-budget]
description = "diff payloads: drop index noise lines, truncate over-long lines, cap the total and tee the original"
match_kind = ["diff"]
truncate_lines_at = 60
max_lines = 6
tee = true
strip_lines_matching = ['^index [0-9a-f]{7,}\.\.[0-9a-f]{7,}']
on_empty = "<diff: no hunk kept>"

[[tests.diff-budget]]
name = "over-long line truncated: first 60 characters kept plus appended ... (no lines dropped, hence no tee marker)"
input = '''
+ src/aaaaaaaa/bbbbbbbbbbbbbbbb/cccccccccc/mmmmmmmmmmmm/nnnnnnnnnn.rs
'''
expected = '''+ src/aaaaaaaa/bbbbbbbbbbbbbbbb/cccccccccc/mmmmmmmmmmmm/nnnn...
'''

[[tests.diff-budget]]
name = "drop index lines first, then cap by max_lines, and tee the original"
input = '''
diff --git a/src/lib.rs b/src/lib.rs
index 1a2b3c4..5d6e7f8 100644
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,3 +1,4 @@ fn main() {
-    let x = 1;
+    let x = 2;
+    let y = 3;
     tail();
'''
expected = '''diff --git a/src/lib.rs b/src/lib.rs
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,3 +1,4 @@ fn main() {
-    let x = 1;
+    let x = 2;
[router:tee sha256=e596ae9c46463f48 lines_dropped=3 bytes_original=190]
'''

[[tests.diff-budget]]
name = "only index noise lines → on_empty"
input = '''
index 1a2b3c4..5d6e7f8 100644
index 9f8e7d6..5c4b3a2 100644
'''
expected = '<diff: no hunk kept>'
