# router v0.1 config example / config.example.yaml
#
# Contract: the field set of this file = docs/spec.md §4 "config schema". Field
#            names, hierarchy and semantics are governed by the spec; this file
#            is a **complete example that an implementation can read directly**
#            (implementations write their parser against this — do not add or
#            remove fields on your own).
# Usage: cp config.example.yaml config.yaml then fill in the roster; config.yaml
#            is already ignored by .gitignore.
#
# Three hard disciplines (AGENTS.md / spec "accounting basis"):
#   1. Secrets are read only from env: this file only names `api_key_env`,
#      **never a key value**.
#   2. Prices and quotas must never be invented: every model/plan carries a
#      `source:` (official page URL + read date), and the `# TODO verify against
#      official source` marker is always kept — this file's job is "schema
#      complete and readable", not "price authority".
#   3. Wherever the spec does not pin down peak/off-peak, units or defaults,
#      this file notes the provenance and known deviations in comments.
#
# Source convention for a human re-checking this file (AGENTS constraint 5): every
#            figure a reviewer may have to verify carries **its own URL and read
#            date on the line it sits on** — `base_url`, every `context`, every
#            price block — so the check is a click, not a leap of faith. A line
#            whose value changed in a re-read says what it was before.
#
# 2026-09-21 re-read of all eight provider entries (the pass this comment records):
#   * corrected: `zai/glm-5.3` context 200k → **1m**, `zai/glm-5.3-flash` context 200k → **1m**
#     (both vendor docs pages state a 1M context window); `kimi/kimi-k3` `cache_write` 0.0 →
#     **0.003** (the intl pricing page prices cache writes per TTL tier — the open ADR-018 finding).
#   * answered: the CN platform's Anthropic / Responses forms (documented, at *different* bases — see
#     `zai-cn` below), which is also why a per-wire base cannot be expressed by one `base_url`: recorded
#     as a known deviation on the entries that declare more than one wire.
#   * replaced: the two plan `quota` blocks whose vendors publish no token allowance (spec §4.0's last
#     bullet, GAP-Q17) — their pages' real allowance shape is in the comments instead.
#   * unchanged: every DeepSeek figure, every `zai-cn` CNY figure, and all four base URLs of the four
#     metered entries — re-read and identical.
#
# Syntax conventions (DESIGN §12.5):
#   - duration: `<integer><ms|s|m|h>`, stackable (e.g. `1h30m`); bare seconds
#     with underscores are not supported.
#   - context: `<integer>` or `<integer>k|m` (k=1024, m=1024×1024); `1m` =
#     1,048,576.
#   - price: the entry's `currency` / 1K tokens (spec §4 basis). Official
#     pages mostly publish per 1M; this file transcribes the /1M value ÷1000
#     and notes the official /1M value at end of line for manual cross-checking.
#     A CNY page is transcribed as CNY — never FX-converted (spec §4.0/§4.8).
#   - provider paths: base_url must already contain the version segment
#     (`/v1`, `/v4`, `/anthropic`); the router only appends
#     `chat → /chat/completions`, `responses → /responses`,
#     `anthropic → /v1/messages`. **One base_url per entry** is therefore the
#     reason a cell the vendor serves at a *different* base is a known
#     deviation rather than a declared cell (see `zai` / `kimi`).
#
# Gap index: GAP-Qn markers and open questions in this file are indexed in
#            `design/DESIGN.md` §12.9.
#            Decided items cite only the spec clause and no longer carry a
#            GAP. (The decisions themselves were recorded on 2026-09-19
#            under `autowork/progress/`; see the round-1 file there for
#            which open question landed in which clause.)

server:
  addr: "127.0.0.1:8790"        # local-first; with server.auth_token_env set, bind it anywhere you can reach it — ingest is then authenticated
  # auth_token_env: ROUTER_TOKEN # optional (spec §4.7): name of the env var whose value every inbound request
                                 #   must present (Bearer / x-api-key); absent ⇒ no inbound auth. Left commented so the
                                 #   copied example still starts before you have chosen a token (a set name with an
                                 #   unset/empty variable refuses startup, spec §5.1).
  upstream_attempt_timeout: 60s # budget for a single upstream attempt (timeout → switch per the fallback chain, spec §8)
  request_timeout: 10m          # budget for the whole inbound request (including the full SSE duration)

session:
  # Candidate sources of session identity, taken in order; the first hit is the
  # session (spec §6 "identity" / DESIGN §6 item 3).
  # `prompt_cache_key` is a responses-protocol body field (measured: clients
  # send it and upstreams echo it, ADR-004); the chat protocol has no such
  # field → naturally falls through to the header sources. All missed →
  # session = null (trace records null, sticky_hit = false, handled as "no
  # session", no error).
  key_sources: ["prompt_cache_key", "header:session-id", "header:thread-id"]
  ttl: 12h                      # session retention for the sticky table and cache ledger; expired = treated as a new session

cache:
  sticky: true                  # same session → same (provider, model); stateful inbound relies on it for fidelity (ADR-004)
  breakeven:
    enabled: true               # when off, it takes no part in failover / quota spill switch decisions (DESIGN §5)
    min_remaining_turns: 3      # estimated remaining turns below this → do not switch at all (unknown estimate → 0 → no switch)
    safety_factor: 1.2          # switch if and only if switch_gain > safety_factor × switch_cost

trace:
  # trace is the only product → autowork interface (ADR-005); on-disk
  # parameters in spec §4.1.
  dir: ./state/traces           # resolved relative to **this config file's directory** (not the CWD); state/ is gitignored
  rollover: hourly              # v0.1 defines only hourly → file name YYYY-MM-DDTHH.jsonl (UTC)
  # retention is deliberately **not** in config: v0.1 does not auto-clean; files
  # are append-only and archived manually by ops (spec §4.1)

providers:
  # One roster entry per provider; `wire_api` = that provider's **native** wire
  # format (the condition for native passthrough).
  # `supports` = the set of inbound protocols the router can translate to it
  # (including wire_api itself) — the declared legal cells of the 3×3 matrix;
  # an undeclared cell = 400 (no "best-effort" translation). Translated cells
  # must handle the spec §2 lossy list item by item.

  - name: deepseek
    region: intl                            # §4.8: the cited prices come from the platform's international
    currency: USD                           #   docs (api-docs.deepseek.com); no CN-mainland endpoint is configured
    base_url: https://api.deepseek.com            # official OpenAI-Format BASE URL
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21 row "BASE URL (OpenAI Format)"
                                                  #   actual endpoints: /chat/completions, /responses
                                                  # official Anthropic-Format BASE: https://api.deepseek.com/anthropic
                                                  #   (same page, row "BASE URL (Anthropic Format)")
    api_key_env: DEEPSEEK_API_KEY                 # the key is read only from this env; no value in this file
    wire_api: responses                           # official docs explicitly support the Responses API (for the Codex scenario)
    supports: [chat, responses, anthropic]        # all three wire formats are officially documented (Responses API / Anthropic API)
                                                  # known deviation: this one `base_url` serves chat and responses; the vendor's
                                                  #   Anthropic base is a *different* path (/anthropic), which the router
                                                  #   cannot reach from this field — see the note above `providers:`
    models:
      - id: deepseek-v4-pro
        context: 1m                               # official page: CONTEXT LENGTH = 1M (MAX OUTPUT 384K)
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21
        price:                                    # five-tier price, USD / 1K tokens (= official /1M ÷1000)
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21 (PRICING rows)
          input_miss: 0.00066                     # official $0.66 /1M (off-peak); peak $1.32 /1M
          input_hit: 0.000022                     # official $0.022 /1M (off-peak); peak $0.044 /1M
          cache_write: 0.0                        # the page publishes no separate cache-write item (spec §4.0: only hit/miss) → 0
          output: 0.00198                         # official $1.98 /1M (off-peak); peak $3.96 /1M
          peak:
            multiplier: 2.0                       # official: "Off-peak rates are half of the peak rates", hence multiplier = 2.0
            windows:                              # official: "Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC, Monday through Friday (all other hours are off-peak)"
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
              # known deviation: Chinese public holidays count as off-peak per the official policy; v0.1 does not model a holiday calendar (DESIGN §12.9 Q6)
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — context, the four tiers and the two peak windows
        #   all match this page; the version label it publishes today is DeepSeek-V4-Pro-0813 (no id change).
      - id: deepseek-flash
        context: 1m                               # official: CONTEXT LENGTH = 1M, MAX OUTPUT 384K — same row as the pro entry
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21
        price:
          input_miss: 0.00015                     # official $0.15 /1M (off-peak); peak $0.30 /1M
          input_hit: 0.000003                     # official $0.003 /1M (off-peak); peak $0.006 /1M
          cache_write: 0.0
          output: 0.0006                          # official $0.6 /1M (off-peak); peak $1.2 /1M
          peak:
            multiplier: 2.0
            windows:
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the id is the page's current name; the legacy
        #   names (deepseek-v4-flash, deepseek-v4-flash-vision-exp) are accepted but retired, and this entry uses
        #   the current one. The page also lists Vision for Flash and not for the pro model — not modelled here.

  # The subscription account. spec §4.6: `account` is a property of the *entry*
  # (the key, the endpoint and the allowance belong to the account), so one
  # model id appears once per account and the two entries differ in base_url,
  # wire_api and key. `plan_policy` at the end of this file names the pair.
  - name: zai-plan
    region: intl                           # §4.8: api.z.ai, prices in USD from docs.z.ai
    currency: USD
    base_url: https://api.z.ai/api/anthropic      # the Anthropic-format BASE; the router appends /v1/messages
                                                  #   source: https://docs.z.ai/devpack/quick-start @2026-09-21 ("Endpoint Guide":
                                                  #   Anthropic Messages = api.z.ai/api/anthropic, OpenAI Chat Completions =
                                                  #   api.z.ai/api/coding/paas/v4, OpenAI Responses = api.z.ai/api/v1)
                                                  #   the plan's Anthropic base is the *same* one the metered entry documents,
                                                  #   so the earlier TODO ("a coding plan may hand out its own base URL") is
                                                  #   answered: it does not (docs.z.ai/devpack/tool/claude sets
                                                  #   ANTHROPIC_BASE_URL to exactly this value for Claude Code)
    api_key_env: ZAI_CODING_API_KEY                 # the plan's key — a separate env var, because it is a separate account
    wire_api: anthropic                           # coding plans are usually handed out in the Anthropic format (the Claude Code shape)
    supports: [anthropic]
    account: coding_plan                          # coding_plan | api (absent ⇒ api)
    models:
      - id: glm-5.3                               # the family's model id (plan_policy.family below); the metered entry serves the same id
        context: 1m                               # **corrected 2026-09-21** (was 200k): the model page states a 1M-token context
                                                  #   window and says GLM-5.3 "is now available to all GLM Coding Plan users"
                                                  #   source: https://docs.z.ai/guides/llm/glm-5.3 @2026-09-21 (MAX OUTPUT 128K)
                                                  #   open item: the plan's own Claude Code config writes the model as
                                                  #   `glm-5.3[1m]` (docs.z.ai/devpack/tool/claude), i.e. the 1M variant may
                                                  #   need that suffix on this wire; the id above is the id the API reference
                                                  #   uses for the non-plan form — check before pointing a plan key at this entry
        price:                                    # the same model's official list price as the metered entry, same source:
          input_miss: 0.0014                      #   inside the plan the marginal price is accounted **0** (spec §4.6 rule 4);
          input_hit: 0.00026                      #   the table still has to be non-zero, because a zero tier is a load error (spec §4.0)
          cache_write: 0.0
          output: 0.0044
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — GLM-5.3 $1.4 / $0.26 cached / storage "Limited-time
        #   Free" / $4.4 per 1M, no peak/off-peak published ⇒ multiplier 1.0, windows empty.
    # no `quota:` — **removed 2026-09-21** (it carried a 100,000,000-token placeholder) because spec §4.0's last
    # bullet is explicit: `quota` states a *token* allowance on a monthly window and nothing else, and a plan whose
    # vendor publishes a different shape carries **no** block. GLM Coding Plan publishes credits, not tokens:
    #   * a 5-hour and a weekly credit allowance, both per plan tier
    #     (https://docs.z.ai/devpack/teamplan @2026-09-21, "Usage Credit Allowance" table + "Credit Reset Rules"):
    #     the 5-hour credits refresh 5 hours after consumption, the weekly ones every 7 days from subscription;
    #   * the deduction formula: model credits = (input × input multiplier + cached input × cached-input multiplier +
    #     output × output multiplier) / 10,000; off-peak usage is charged at **50%** of the standard credit rate, so
    #     the token allowance is a range whose ends are "all off-peak" and "all peak" (both stated on that page);
    #   * the plan's price ("from $18/month") is on https://z.ai/subscribe; the vendor publishes no token count for it.
    # The upstream remains the only authority on exhaustion (spec §4.6 rule 3, GAP-Q17 / DESIGN §12.9). Point a
    # client at the plan and let it tell you; do not derive a verdict from a number nobody published.

  - name: zai
    region: intl                           # §4.8: api.z.ai. The same vendor's CN-mainland entries
    currency: USD                          #   (zai-cn / zai-cn-plan) sit below — two regions, two currencies
    base_url: https://api.z.ai/api/paas/v4        # official curl-example endpoint: /chat/completions
                                                  #   source: https://docs.z.ai/api-reference/llm/chat-completion @2026-09-21
                                                  #   (OpenAPI `servers: https://api.z.ai/api` + path `/paas/v4/chat/completions`)
                                                  #   official Anthropic-Format BASE: https://api.z.ai/api/anthropic
                                                  #   OpenAI Responses BASE: https://api.z.ai/api/v1 (docs.z.ai/devpack/quick-start)
                                                  #   note: the GLM-5.3 model page's own table lists the OpenAI chat base as
                                                  #   https://api.z.ai/api/coding/paas/v4 — that is the *coding-plan* base
                                                  #   (the `zai-plan` account above), not this metered account's
    api_key_env: ZAI_API_KEY
    wire_api: chat
    supports: [chat, anthropic]                   # only the OpenAI and Anthropic formats are officially documented;
                                                  #   undocumented formats are not declared (better missing than guessed: undeclared = 400)
                                                  # known deviation: the anthropic cell is documented at /api/anthropic, while this
                                                  #   entry's base_url is /api/paas/v4 — one base_url cannot carry both, so an
                                                  #   anthropic inbound would be sent to /api/paas/v4/v1/messages. Same shape as
                                                  #   the deepseek and kimi entries; the fix is a per-wire base field (a schema
                                                  #   decision), not a value in this file
    models:
      - id: glm-5.3
        context: 1m                               # **corrected 2026-09-21** (was 200k): "a 1M-token context window",
                                                  #   MAX OUTPUT 128K, text-only
                                                  #   source: https://docs.z.ai/guides/llm/glm-5.3 @2026-09-21
        price:
          input_miss: 0.0014                      # official $1.4 /1M
          input_hit: 0.00026                      # official $0.26 /1M
          cache_write: 0.0                        # official "Cached Input Storage: Limited-time Free" (free for a limited period)
          output: 0.0044                          # official $4.4 /1M
          peak: { multiplier: 1.0, windows: [] }  # no peak/off-peak published officially → same price at all times
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the four figures above and "Limited-time Free"
        #   storage are unchanged; the rules after the storage promotion ends are still unpublished.
      - id: glm-5.3-flash
        context: 1m                               # **corrected 2026-09-21** (was 200k): "Context Length 1M", MAX OUTPUT 128K
                                                  #   source: https://docs.z.ai/guides/vlm/glm-5.3-flash @2026-09-21
        price:
          input_miss: 0.00015                     # official $0.15 /1M list price (a 50% promotion listed $0.075 /1M)
          input_hit: 0.00003                      # official $0.03 /1M list (promotion $0.015 /1M)
          cache_write: 0.0
          output: 0.0005                          # official $0.50 /1M list (promotion $0.25 /1M)
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the list prices are the ones recorded; the
        #   pricing page states the 50% promotion "ends at 24:00 on September 9, 2026 (UTC+8, Singapore time)".
      - id: glm-4.7
        context: 200k                             # source: https://docs.z.ai/guides/llm/glm-4.7 @2026-09-21
                                                  #   ("Context Length 200K", MAX OUTPUT 128K) — re-read, unchanged
        price:
          input_miss: 0.0006                      # official $0.6 /1M
          input_hit: 0.00011                      # official $0.11 /1M
          cache_write: 0.0
          output: 0.0022                          # official $2.2 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the pricing page still lists GLM-4.7 in its
        #   "Text Models" table at these figures; the model page is still published (context 200K re-confirmed).
    # no `quota:` on the metered entry: an allowance belongs to the subscription
    # account above (spec §4.6 `account`), and the metered route is the family's
    # `overflow` in `plan_policy` at the end of this file.

  - name: kimi
    # Renamed from `moonshot` (ADR-018 §3's one-time correction): a provider
    # name that disagrees with its own `api_key_env` (KIMI_*) is the mismatch
    # an operator sees on the first /health read. The naming convention is
    # documentation, not a load rule.
    region: intl                           # §4.8: api.moonshot.ai; prices in USD from platform.moonshot.ai
    currency: USD                          #   (the platform's pages answer on the kimi.ai host family today —
                                           #    a 301 measured in R6; the endpoint host is unchanged, and the
                                           #    pricing page now serves on platform.kimi.ai — verified 2026-09-21)
    base_url: https://api.moonshot.ai/v1          # official quickstart: base_url = https://api.moonshot.ai/v1
                                                  #   source: https://platform.kimi.ai/docs/api/overview @2026-09-21
                                                  #   ("Protocol Compatibility": OpenAI Chat Completions **and** OpenAI
                                                  #   Responses both use /v1; Anthropic Messages uses /anthropic)
                                                  #   official Anthropic-Format BASE: https://api.moonshot.ai/anthropic
    api_key_env: KIMI_API_KEY                      # Kimi's official quickstart examples use MOONSHOT_API_KEY;
                                                  #   this repo names it KIMI_* per owner naming, so it is never
                                                  #   mistaken for a typo of the platform's own variable
    wire_api: chat
    supports: [chat, anthropic]                   # official: compatible with both the OpenAI and Anthropic API formats
                                                  #   the same page also documents an OpenAI Responses endpoint at this
                                                  #   base (/v1/responses) — not declared here: `supports` is the router's
                                                  #   capability matrix (spec §2), and this round changes values, not cells
                                                  # known deviation: the anthropic base is /anthropic, not /v1 — see the
                                                  #   note above `providers:`
    models:
      - id: kimi-k3
        context: 1m                               # official: 1,048,576 tokens (Context Window column)
                                                  #   source: https://platform.kimi.ai/docs/pricing/chat @2026-09-21
        price:
          input_miss: 0.003                       # official $3.00 /1M (Input Price, cache miss)
          input_hit: 0.0003                       # official $0.30 /1M (Cached Input Price)
          cache_write: 0.003                      # official $3.00 /1M at the **5-minute TTL tier** — the page's stated
                                                  #   default when a request carries no explicit TTL (spec §4.0's rule);
                                                  #   the 1-hour tier is $6.00 /1M. **Corrected 2026-09-21**: this line read
                                                  #   0.0 with the note "the official page lists no cache-write billing
                                                  #   item" — true of the page read before, false of the page today, and
                                                  #   ADR-018's honest-boundaries section had already registered it as an
                                                  #   open finding (the finding is now closed by this value)
          output: 0.015                           # official $15.00 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.kimi.ai/docs/pricing/chat @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — cache write $3.00 (5 min) / $6.00 (1 h), cached
        #   input $0.30, input $3.00, output $15.00, context 1,048,576, all on one row of the K3 table.
      - id: kimi-k2.7-code
        context: 256k                             # official: 262,144 tokens (= 256k exactly)
                                                  #   source: https://platform.kimi.ai/docs/pricing/chat @2026-09-21
        price:
          input_miss: 0.00095                     # official $0.95 /1M (cache miss)
          input_hit: 0.00019                      # official $0.19 /1M (cache hit)
          cache_write: 0.0                        # the K2 table has no cache-write column at all (only the K3 table is
                                                  #   TTL-tiered) → 0, and this is a read fact, not a missing one
          output: 0.004                           # official $4.00 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.kimi.ai/docs/pricing/chat @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the K2 table also lists kimi-k2.7-code-highspeed
        #   ($0.38 / $1.90 / $8.00) and kimi-k2.6 ($0.16 / $0.95 / $4.00); neither is in this roster.

  # The second subscription account, configured like zai-plan above — with one
  # difference that is the point of spec §4.6: v0.1 carries **at most one**
  # `plan_policy`, so this plan account is a legal roster entry that no policy
  # routes yet. Point `plan_policy` at it (family: the tag below) to make it the
  # preferred account instead of zai-plan.
  - name: kimi-plan
    region: intl                           # §4.8: the international deployment's Kimi Code account
    currency: USD
    # Kimi model ids differ per platform: the **coding** endpoint (Kimi Code, the
    # membership entitlement) serves k3 / k3-256k / kimi-for-coding /
    # kimi-for-coding-highspeed, while the **open platform** endpoint above serves
    # kimi-k3 / kimi-k2.7-code. This entry is the coding account, so it addresses
    # the coding endpoint and uses the coding endpoint's own id; the pair below the
    # CN entries (kimi-cn-plan/k3 + kimi-cn/kimi-k3) demonstrates the §4.8 family
    # tag that pairs two different native ids, and this intl pair now does the same.
    base_url: https://api.kimi.ai/coding/         # **corrected 2026-09-21**: this entry previously pointed at
                                                  #   https://api.moonshot.ai/anthropic, which is the *open platform's*
                                                  #   Anthropic base (the metered `kimi` account above), not a coding
                                                  #   endpoint. The Kimi Code docs publish the coding bases per region:
                                                  #   source: https://www.kimi.com/code/docs/ @2026-09-21
                                                  #     Anthropic format — intl https://api.kimi.ai/coding/ (this line)
                                                  #                        CN   https://api.kimi.com/coding/ (kimi-cn-plan below)
                                                  #     OpenAI format    — intl https://api.kimi.ai/coding/v1
                                                  #                        CN   https://api.kimi.com/coding/v1
                                                  #   the router appends /v1/messages to this base
    api_key_env: KIMI_CODING_API_KEY               # see the KIMI_* naming note on the metered kimi entry above
    wire_api: anthropic
    supports: [anthropic]
    account: coding_plan
    models:
