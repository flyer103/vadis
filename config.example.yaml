# router v0.1 config example / config.example.yaml
#
# Contract: the field set of this file = docs/spec.md §4 "config schema". Field
#            names, hierarchy and semantics are governed by the spec; this file
#            is a **complete example that an implementation can read directly**
#            (implementations write their parser against this — do not add or
#            remove fields on your own).
# Usage: cp config.example.yaml config.yaml then fill in the roster; config.yaml
#            is already ignored by .gitignore.
#
# Three hard disciplines (AGENTS.md / spec "accounting basis"):
#   1. Secrets are read only from env: this file only names `api_key_env`,
#      **never a key value**.
#   2. Prices and quotas must never be invented: every model/plan carries a
#      `source:` (official page URL + read date), and the `# TODO verify against
#      official source` marker is always kept — this file's job is "schema
#      complete and readable", not "price authority".
#   3. Wherever the spec does not pin down peak/off-peak, units or defaults,
#      this file notes the provenance and known deviations in comments.
#
# Syntax conventions (DESIGN §12.5):
#   - duration: `<integer><ms|s|m|h>`, stackable (e.g. `1h30m`); bare seconds
#     with underscores are not supported.
#   - context: `<integer>` or `<integer>k|m` (k=1024, m=1024×1024); `1m` =
#     1,048,576.
#   - price: USD / 1K tokens (spec §4 basis). Official pages mostly publish
#     USD / 1M; this file transcribes the /1M value ÷1000 and notes the
#     official /1M value at end of line for manual cross-checking.
#   - provider paths: base_url must already contain the version segment
#     (`/v1`, `/v4`, `/anthropic`); the router only appends
#     `chat → /chat/completions`, `responses → /responses`,
#     `anthropic → /v1/messages`.
#
# Gap index: GAP-Qn markers and open questions in this file are indexed in
#            `design/DESIGN.md` §12.9.
#            R1-4 has written Q2/Q3/Q5/Q10/Q11/Q12 back into `docs/spec.md`
#            (§4.1/§4.2/§4.3/§4.4/§6/§8): comments in this file that still
#            carry a GAP marker are **undecided** items; decided items cite
#            only the spec clause and no longer carry a GAP.

server:
  addr: "127.0.0.1:8790"        # local-first; with server.auth_token_env set, bind it anywhere you can reach it — ingest is then authenticated
  # auth_token_env: ROUTER_TOKEN # optional (spec §4.7): name of the env var whose value every inbound request
                                 #   must present (Bearer / x-api-key); absent ⇒ no inbound auth. Left commented so the
                                 #   copied example still starts before you have chosen a token (a set name with an
                                 #   unset/empty variable refuses startup, spec §5.1).
  upstream_attempt_timeout: 60s # budget for a single upstream attempt (timeout → switch per the fallback chain, spec §8)
  request_timeout: 10m          # budget for the whole inbound request (including the full SSE duration)

session:
  # Candidate sources of session identity, taken in order; the first hit is the
  # session (spec §6 "identity" / DESIGN §6 item 3).
  # `prompt_cache_key` is a responses-protocol body field (measured: clients
  # send it and upstreams echo it, ADR-004); the chat protocol has no such
  # field → naturally falls through to the header sources. All missed →
  # session = null (trace records null, sticky_hit = false, handled as "no
  # session", no error).
  key_sources: ["prompt_cache_key", "header:session-id", "header:thread-id"]
  ttl: 12h                      # session retention for the sticky table and cache ledger; expired = treated as a new session

cache:
  sticky: true                  # same session → same (provider, model); stateful inbound relies on it for fidelity (ADR-004)
  breakeven:
    enabled: true               # when off, it takes no part in failover / quota spill switch decisions (DESIGN §5)
    min_remaining_turns: 3      # estimated remaining turns below this → do not switch at all (unknown estimate → 0 → no switch)
    safety_factor: 1.2          # switch if and only if switch_gain > safety_factor × switch_cost

trace:
  # trace is the only product → autowork interface (ADR-005); on-disk
  # parameters in spec §4.1.
  dir: ./state/traces           # resolved relative to **this config file's directory** (not the CWD); state/ is gitignored
  rollover: hourly              # v0.1 defines only hourly → file name YYYY-MM-DDTHH.jsonl (UTC)
  # retention is deliberately **not** in config: v0.1 does not auto-clean; files
  # are append-only and archived manually by ops (spec §4.1)

providers:
  # One roster entry per provider; `wire_api` = that provider's **native** wire
  # format (the condition for native passthrough).
  # `supports` = the set of inbound protocols the router can translate to it
  # (including wire_api itself) — the declared legal cells of the 3×3 matrix;
  # an undeclared cell = 400 (no "best-effort" translation). Translated cells
  # must handle the spec §2 lossy list item by item.

  - name: deepseek
    base_url: https://api.deepseek.com            # official OpenAI-Format BASE URL
                                                  #   actual endpoints: /chat/completions, /responses
                                                  #   official Anthropic-Format BASE: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY                 # the key is read only from this env; no value in this file
    wire_api: responses                           # official docs explicitly support the Responses API (for the Codex scenario)
    supports: [chat, responses, anthropic]        # all three wire formats are officially documented (Responses API / Anthropic API)
    models:
      - id: deepseek-v4-pro
        context: 1m                               # official page: CONTEXT LENGTH = 1M (MAX OUTPUT 384K)
        price:                                    # five-tier price, USD / 1K tokens (= official /1M ÷1000)
          input_miss: 0.00066                     # official $0.66 /1M (off-peak)
          input_hit: 0.000022                     # official $0.022 /1M (off-peak)
          cache_write: 0.0                        # official page lists no cache-write billing item → record 0 and keep the TODO
          output: 0.00198                         # official $1.98 /1M (off-peak)
          peak:
            multiplier: 2.0                       # official: off-peak = half of peak, hence multiplier = 2.0
            windows:                              # official: peak = Monday–Friday 01:00-04:00 and 06:00-10:00 UTC
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
              # known deviation: Chinese public holidays count as off-peak per the official policy; v0.1 does not model a holiday calendar (DESIGN §12.9 Q6)
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-19"
        # TODO verify against official source: the five-tier prices and peak windows above were transcribed from the official page during this session and need one manual review before merging.
      - id: deepseek-flash
        context: 1m
        price:
          input_miss: 0.00015                     # official $0.15 /1M (off-peak)
          input_hit: 0.000003                     # official $0.003 /1M (off-peak)
          cache_write: 0.0
          output: 0.0006                          # official $0.6 /1M (off-peak)
          peak:
            multiplier: 2.0
            windows:
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-19"
        # TODO verify against official source

  # The subscription account. spec §4.6: `account` is a property of the *entry*
  # (the key, the endpoint and the allowance belong to the account), so one
  # model id appears once per account and the two entries differ in base_url,
  # wire_api and key. `plan_policy` at the end of this file names the pair.
  - name: zai-plan
    base_url: https://api.z.ai/api/anthropic      # the Anthropic-format BASE; the router appends /v1/messages
                                                  #   TODO verify against the plan's own page: a coding plan may hand out
                                                  #   its own base URL instead of the metered entry's
    api_key_env: ZAI_CODING_API_KEY                 # the plan's key — a separate env var, because it is a separate account
    wire_api: anthropic                           # coding plans are usually handed out in the Anthropic format (the Claude Code shape)
    supports: [anthropic]
    account: coding_plan                          # coding_plan | api (absent ⇒ api)
    models:
      - id: glm-5.3                               # the family's model id (plan_policy.family below); the metered entry serves the same id
        context: 200k
        price:                                    # the same model's official list price as the metered entry, same source:
          input_miss: 0.0014                      #   inside the plan the marginal price is accounted **0** (spec §4.6 rule 4);
          input_hit: 0.00026                      #   the table still has to be non-zero, because a zero tier is a load error (spec §4.0)
          cache_write: 0.0
          output: 0.0044
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-19"
        # TODO verify against official source
    quota:                                        # the plan's own allowance: optional — a plan whose allowance is not
      - models: [glm-5.3]                         # published is still a plan (spec §4.6), so this block may be deleted
        window: monthly
        tokens: 100_000_000                       # placeholder (the official page only publishes $18/month, no token allowance)
        reset_day: 1
        over_quota: block                         # block: reject with a stated reason; spill: the overflow is billed at input_miss
        source: "https://docs.z.ai/guides/overview/quick-start @2026-09-19"
        # The official page only publishes the GLM Coding Plan subscription
        # price of $18/month, not a token allowance → the tokens value above is
        # a placeholder.
        # Under spec §4.6 (GAP-Q16) this local verdict is a **warning** for a
        # plan: it is recorded in `cost.quota_after` and it may defer a probe,
        # but the refusal follows upstream evidence and plan_policy's
        # `on_primary_exhausted` — never this counter alone.
        # TODO verify against official source: the allowance value, metering
        #      basis (input+output? does it include cache_read?) and the reset
        #      timezone are all to be confirmed — GAP-Q1 (DESIGN §12.9)

  - name: zai
    base_url: https://api.z.ai/api/paas/v4        # official curl-example endpoint: /chat/completions
                                                  #   official Anthropic-Format BASE: https://api.z.ai/api/anthropic
    api_key_env: ZAI_API_KEY
    wire_api: chat
    supports: [chat, anthropic]                   # only the OpenAI and Anthropic formats are officially documented;
                                                  #   undocumented formats are not declared (better missing than guessed: undeclared = 400)
    models:
      - id: glm-5.3
        context: 200k                             # TODO verify against official source: the pricing page lists no context; check the model page
        price:
          input_miss: 0.0014                      # official $1.4 /1M
          input_hit: 0.00026                      # official $0.26 /1M
          cache_write: 0.0                        # official "Cached Input Storage: Limited-time Free" (free for a limited period)
          output: 0.0044                          # official $4.4 /1M
          peak: { multiplier: 1.0, windows: [] }  # no peak/off-peak published officially → same price at all times
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-19"
        # TODO verify against official source (including the rules after the cache_write "limited-time free" period ends)
      - id: glm-5.3-flash
        context: 200k                             # TODO verify against official source
        price:
          input_miss: 0.00015                     # official $0.15 /1M
          input_hit: 0.00003                      # official $0.03 /1M
          cache_write: 0.0
          output: 0.0005                          # official $0.50 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-19"
        # TODO verify against official source
      - id: glm-4.7
        context: 200k                             # TODO verify against official source
        price:
          input_miss: 0.0006                      # official $0.6 /1M
          input_hit: 0.00011                      # official $0.11 /1M
          cache_write: 0.0
          output: 0.0022                          # official $2.2 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-19"
        # TODO verify against official source
    # no `quota:` on the metered entry: an allowance belongs to the subscription
    # account above (spec §4.6 `account`), and the metered route is the family's
    # `overflow` in `plan_policy` at the end of this file.

  - name: moonshot
    base_url: https://api.moonshot.ai/v1          # official quickstart: base_url = https://api.moonshot.ai/v1
    api_key_env: KIMI_API_KEY                      # Kimi's official quickstart examples use MOONSHOT_API_KEY;
                                                  #   this repo names it KIMI_* per owner naming, so it is never
                                                  #   mistaken for a typo of the platform's own variable
    wire_api: chat
    supports: [chat, anthropic]                   # official: compatible with both the OpenAI and Anthropic API formats
    models:
      - id: kimi-k3
        context: 1m                               # official: 1,048,576 tokens
        price:
          input_miss: 0.003                       # official $3.00 /1M (Input Price, Cache Miss)
          input_hit: 0.0003                       # official $0.30 /1M (Input Price, Cache Hit)
          cache_write: 0.0                        # official page lists no cache-write billing item → record 0, keep the TODO
          output: 0.015                           # official $15.00 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.moonshot.ai/docs/pricing/chat @2026-09-19"
        # TODO verify against official source
      - id: kimi-k2.7-code
        context: 256k                             # official: 262,144 tokens
        price:
          input_miss: 0.00095                     # official $0.95 /1M
          input_hit: 0.00019                      # official $0.19 /1M
          cache_write: 0.0
          output: 0.004                           # official $4.00 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.moonshot.ai/docs/pricing/chat @2026-09-19"
        # TODO verify against official source

  # The second subscription account, configured exactly like zai-plan above —
  # with one difference that is the point of spec §4.6: v0.1 carries **at most
  # one** `plan_policy`, so this plan account is a legal roster entry that no
  # policy routes yet. Point `plan_policy` at it (family: the model id below)
  # to make it the preferred account instead of zai-plan.
  - name: moonshot-plan
    base_url: https://api.moonshot.ai/anthropic   # the Anthropic-compatible BASE; the router appends /v1/messages
                                                  #   TODO verify against the plan's own page (the metered entry above uses /v1)
    api_key_env: KIMI_CODING_API_KEY               # see the KIMI_* naming note on the metered moonshot entry above
    wire_api: anthropic
    supports: [anthropic]
    account: coding_plan
    models:
      - id: kimi-k2.7-code
        context: 256k
        price:                                    # the same model's official list price as the metered entry, same source
          input_miss: 0.00095
          input_hit: 0.00019
          cache_write: 0.0
          output: 0.004
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.moonshot.ai/docs/pricing/chat @2026-09-19"
        # TODO verify against official source
    quota:                                        # optional (spec §4.6): the plan's allowance, if the plan page publishes one
      - models: [kimi-k2.7-code]
        window: monthly
        tokens: 100_000_000                       # placeholder — the plan page has not been read for an allowance value
        reset_day: 1
        over_quota: block
        source: "https://platform.moonshot.ai/docs/pricing/chat @2026-09-19"
        # TODO verify against official source: the coding-plan page (its
        #      allowance, metering basis and reset timezone) — GAP-Q1
        #      (DESIGN §12.9). The price source above is the *pricing* page the
        #      metered entry cites; it is not a plan page.

aliases:
  # alias → one route in the roster (`provider/model`). An alias only resolves a
  # name; the outbound `model` is replaced by the resolved roster id whichever
  # form the client used (spec §2), so an alias and the direct `provider/model`
  # produce byte-identical bytes upstream.
  coding-fast: deepseek/deepseek-v4-pro
  coding-bulk: moonshot/kimi-k2.7-code
  chat-fast: zai/glm-5.3-flash
  # Aliases pointing to `auto` or carrying parameter overrides (max_tokens
  # etc.) are undefined in v0.1 → GAP-Q13 (DESIGN §12.9)

plugins:
  # Declarative list + keyed diff (ADR-002): config change → each plugin diffs
  # and reloads on its own (no process rebuild);
  # `disabled: true` → unload that fiber and roll back all its effects;
  # `id`/`kind` change → rebuild that entry.
  # Three more built-in plugins are always resident with no config entries of
  # their own: builtin/cost_ledger, builtin/quota_guard, builtin/sticky
  # (DESIGN §2, router-plugins).

  - id: cache-guard
    kind: builtin/cache_guard                     # tier-A: compiled into the product, no module-level HMR (ADR-002)
    config: { strict_prefix: true }               # prefix discontinuity: false = warn and continue; true = reject that transform

  - id: tool-output-rules
    kind: builtin/transform_rules                 # rules as data (TOML + inline tests, ADR-003)
    config:
      rules_file: ./rules/tool_output.toml        # resolved relative to **this config file's directory** (not the CWD)
      on_failure: passthrough                     # rule load/execution failure → fall back to the original text (spec §8 fail-safe)
      # Rules may declare `tee` (spec §4.4); but v0.1 provides **no** on-disk
      # directory for originals and no retrieval channel — spec §4.4 already
      # marks both as unimplemented (deferred until after D3), so keys like
      # tee_dir deliberately **do not appear** in this file.

  - id: judge-experiment
    kind: process                                 # tier-B: out-of-process plugin (with module-level HMR)
    url: unix:///tmp/router-plugins/judge.sock
    inject: [cache_ledger, session_table]         # dependency declaration (coeffect, spec §4.3): unmet → stays in a loading wait
                                                  #   service names are product-defined typed slot names, not arbitrary strings
    isolate: false                                # true = separate realm: another set of bindings for the same services,
                                                  #   used to run two versions of one policy side by side for shadow comparison (ADR-002)
    intercept: { sample: 0.05, shadow: true }     # changes no bindings, only "how they are used": 5% sampling, shadow produces no output
    disabled: true                                # off by default; enabling it for experiments changes no product code

fallback:
  # Ordered route list at global granularity (schema in spec §4.2; v0.1 has no
  # per-model/per-alias chains).
  # Semantics: on upstream 5xx / 429 / quota exhaustion, switch in order to
  # "the next route not yet tried"; switching loses the prefix cache, so the
  # trace must record `failover_from` and the resulting re-prefill cost
  # (spec §6 "outcome" / DESIGN §5).
  # Chain exhausted → 502 upstream_error (upstream attempt timeout → 504
  # upstream_timeout); error body per spec §8.
  - deepseek/deepseek-v4-pro
  - moonshot/kimi-k3
  - zai/glm-5.3

plan_policy:
  # spec §4.6 / ADR-014 — the subscription first, the metered account as the
  # spill. Optional, and **at most one** in v0.1 (a second family is an additive
  # future key, never a reshaped section). The keys and this example land
  # together (GAP-Q15): `deny_unknown_fields` makes an example that carries a key
  # the parser does not know an unservable file.
  family: glm-5.3                    # required: the model id both routes carry — and the key of the family's state
  primary: zai-plan/glm-5.3          # required: a roster route whose provider is `account: coding_plan`
  overflow: zai/glm-5.3              # required: a distinct roster route whose provider is `account: api`. For a request inside
                                     #   this family it is the first candidate after `primary`, before the `fallback` list above (§4.2)
  on_primary_exhausted: spill        # spill | block (default spill). spill: the family continues on the metered account at its
                                     #   real price. block: the request is refused with `quota_exceeded` (429, §8) instead of being
                                     #   served from the metered account.
  recover: probe                     # probe | none (default probe). probe: after the cooldown the first request of a new session
                                     #   tries the plan again, and a success is recorded. none: no automatic probe — the family
                                     #   returns at the plan's own window boundary, or by an operator action.
  cooldown: 15m                      # default 15m: the floor between the move away from `primary` and the first admitted probe
  # overflow_monthly_cap_usd: 20.0   # optional: a ceiling on this family's **metered** spend in a UTC calendar month, compared
                                     #   against measured usage priced by this file's table. Once reached, the family's overflow
                                     #   requests are refused with `cost_cap_exceeded` (403, §8). The request that crosses the
                                     #   ceiling is served (its cost cannot be known beforehand), so the overshoot is at most one
                                     #   request. Absent = no cap; commented out here on purpose — the shipped example imposes none.
  # A plan's `quota` is a warning, not the authority (spec §4.6 rule 3, GAP-Q1):
  # only an upstream `403 quota_exhausted` moves the account, and it may defer a
  # probe until the plan's own window boundary has passed.

# spec §4.6's other key lives on the provider entries above, not here:
# `account: coding_plan | api` (absent ⇒ api) — see `zai-plan` and
# `moonshot-plan`. Operators who want no speculative attempt at all write
# `recover: none` above instead.
