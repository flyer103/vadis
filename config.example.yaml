# vadis v0.1 config example / config.example.yaml
#
# Contract: the field set of this file = docs/spec.md §4 "config schema". Field
#            names, hierarchy and semantics are governed by the spec; this file
#            is a **complete example that an implementation can read directly**
#            (implementations write their parser against this — do not add or
#            remove fields on your own).
# Usage: cp config.example.yaml config.yaml with providers.example.yaml kept
#            beside it (the root names it — `providers_file:` below), then fill
#            in the roster; config.yaml is already ignored by .gitignore.
#
# Three hard disciplines (AGENTS.md / spec "accounting basis"):
#   1. Secrets are read only from env: this file only names `api_key_env`,
#      **never a key value**.
#   2. Prices and quotas must never be invented: every model/plan carries a
#      `source:` (official page URL + read date), and the `# TODO verify against
#      official source` marker is always kept — this file's job is "schema
#      complete and readable", not "price authority".
#   3. Wherever the spec does not pin down peak/off-peak, units or defaults,
#      this file notes the provenance and known deviations in comments.
#
# Source convention for a human re-checking this file (AGENTS constraint 5): every
#            figure a reviewer may have to verify carries **its own URL and read
#            date on the line it sits on** — every `urls` entry, every `context`,
#            every price block — so the check is a click, not a leap of faith. A line
#            whose value changed in a re-read says what it was before.
#
# 2026-09-21 re-read of all eight provider entries (the pass this comment records):
#   * corrected: `zai/glm-5.3` context 200k → **1m**, `zai/glm-5.3-flash` context 200k → **1m**
#     (both vendor docs pages state a 1M context window); `kimi/kimi-k3` `cache_write` 0.0 →
#     **0.003** (the intl pricing page prices cache writes per TTL tier — the open ADR-018 finding).
#   * answered: the CN platform's Anthropic / Responses forms (documented, at *different* bases — see
#     `zai-cn` below). Every metered vendor in this file serves its wire forms at different bases, so one
#     `base_url` could never express them: ADR-020 replaced it with `urls`, one complete URL per wire,
#     and every declared cell below now carries the endpoint its own page states.
#   * replaced: the two plan `quota` blocks whose vendors publish no token allowance (spec §4.0's last
#     bullet, GAP-Q17) — their pages' real allowance shape is in the comments instead.
#   * unchanged: every DeepSeek figure, every `zai-cn` CNY figure, and all four metered endpoints —
#     re-read and identical.
#   * schema: `base_url` → `urls` in the same pass (ADR-020). The load-time rule is now
#     `set(urls) == set(supports)`: a declared wire with no URL, or a URL for a wire the entry does not
#     declare, refuses the start — so "declared but unreachable" is no longer a state this file can be in.
#
# Syntax conventions (DESIGN §12.5):
#   - duration: `<integer><ms|s|m|h>`, stackable (e.g. `1h30m`); bare seconds
#     with underscores are not supported.
#   - context: `<integer>` or `<integer>k|m` (k=1024, m=1024×1024); `1m` =
#     1,048,576.
#   - price: the entry's `currency` / 1K tokens (spec §4 basis). Official
#     pages mostly publish per 1M; this file transcribes the /1M value ÷1000
#     and notes the official /1M value at end of line for manual cross-checking.
#     A CNY page is transcribed as CNY — never FX-converted (spec §4.0/§4.8).
#   - provider endpoints: `urls` gives each wire the entry declares its
#     **complete** URL, transcribed from the page the entry cites. The vadis
#     appends nothing, trims nothing and normalizes nothing (spec §4.9,
#     ADR-020) — what is written here is what goes on the wire. The key set
#     must equal `supports` exactly; a mismatch refuses the start.
#
# Gap index: GAP-Qn markers and open questions in this file are indexed in
#            `design/DESIGN.md` §12.9.
#            Decided items cite only the spec clause and no longer carry a
#            GAP. (The decisions themselves were recorded on 2026-09-19
#            and are reflected in the design documents for the clauses
#            whose open questions they settled.)

server:
  addr: "127.0.0.1:8790"        # local-first; with server.auth_token_env set, bind it anywhere you can reach it — ingest is then authenticated
  # auth_token_env: VADIS_TOKEN # optional (spec §4.7): name of the env var whose value every inbound request
                                 #   must present (Bearer / x-api-key); absent ⇒ no inbound auth. Left commented so the
                                 #   copied example still starts before you have chosen a token (a set name with an
                                 #   unset/empty variable refuses startup, spec §5.1).
  upstream_attempt_timeout: 60s # budget for a single upstream attempt (timeout → switch per the fallback chain, spec §8)
  request_timeout: 10m          # budget for the whole inbound request (including the full SSE duration)

session:
  # Candidate sources of session identity, taken in order; the first hit is the
  # session (spec §6 "identity" / DESIGN §6 item 3).
  # `prompt_cache_key` is a responses-protocol body field (measured: clients
  # send it and upstreams echo it, ADR-004); the chat protocol has no such
  # field → naturally falls through to the header sources. All missed →
  # session = null (trace records null, sticky_hit = false, handled as "no
  # session", no error).
  key_sources: ["prompt_cache_key", "header:session-id", "header:thread-id"]
  ttl: 12h                      # session retention for the sticky table and cache ledger; expired = treated as a new session

cache:
  sticky: true                  # same session → same (provider, model); stateful inbound relies on it for fidelity (ADR-004)
  breakeven:
    enabled: true               # when off, it takes no part in failover / quota spill switch decisions (DESIGN §5)
    min_remaining_turns: 3      # estimated remaining turns below this → do not switch at all (unknown estimate → 0 → no switch)
    safety_factor: 1.2          # switch if and only if switch_gain > safety_factor × switch_cost

trace:
  # trace is the only product → analysis-loop interface (ADR-005); on-disk
  # parameters in spec §4.1.
  dir: ./state/traces           # resolved relative to **this config file's directory** (not the CWD); state/ is gitignored
  rollover: hourly              # v0.1 defines only hourly → file name YYYY-MM-DDTHH.jsonl (UTC)
  # retention is deliberately **not** in config: v0.1 does not auto-clean; files
  # are append-only and archived manually by ops (spec §4.1)

# The roster is its own file (spec §4.14): the `providers:` block this file
# carried inline through v0.1's early rounds moved to `providers.example.yaml`
# byte for byte — entries, comments and every source citation included.
# Exactly one of `providers:` / `providers_file:` is written; both or neither
# is a load refusal that names both keys.
providers_file: providers.example.yaml  # resolved against this file's own directory (§4.1) — named, never searched

aliases:
  # alias → one route in the roster (`provider/model`). An alias only resolves a
  # name; the outbound `model` is replaced by the resolved roster id whichever
  # form the client used (spec §2), so an alias and the direct `provider/model`
  # produce byte-identical bytes upstream.
  coding-fast: deepseek/deepseek-flash
  coding-bulk: kimi/kimi-k3
  chat-fast: zai/glm-5.3-flash
  # Stable client-side names for the plan entries (born 2026-09-21 as "1M
  # spelling" aliases; the ids were reverted to bare on 2026-09-22 by R16-1 —
  # `[1m]` is a Claude-Code client-side switch the upstream refuses as an id
  # (400 [1211] on every plan wire, measured), so the routes carry the bare,
  # upstream-native ids and the aliases keep their `/`-free client names.
  # An alias and the direct route are byte-identical upstream (spec §2).
  glm-plan: zai-plan/glm-5.3
  glm-plan-flash: zai-plan/glm-5.3-flash
  # Aliases pointing to `auto` or carrying parameter overrides (max_tokens
  # etc.) are undefined in v0.1 → GAP-Q13 (DESIGN §12.9)

plugins:
  # Declarative list + keyed diff (ADR-002): config change → each plugin diffs
  # and reloads on its own (no process rebuild);
  # `disabled: true` → unload that fiber and roll back all its effects;
  # `id`/`kind` change → rebuild that entry.
  # Three more built-in plugins are always resident with no config entries of
  # their own: builtin/cost_ledger, builtin/quota_guard, builtin/sticky
  # (DESIGN §2, vadis-plugins).

  - id: cache-guard
    kind: builtin/cache_guard                     # tier-A: compiled into the product, no module-level HMR (ADR-002)
    config: { strict_prefix: true }               # prefix discontinuity: false = warn and continue; true = reject that transform

  - id: tool-output-rules
    kind: builtin/transform_rules                 # rules as data (TOML + inline tests, ADR-003)
    config:
      # `vadis setup` writes this file beside the config, from the rule file embedded
      # in the binary: created when it is absent, left untouched otherwise, and replaced
      # only by `--force` with the `plugins` section selected (spec §4.11's rule-file
      # lane; ADR-046). Without that, a fresh XDG install carries a named absence here.
      rules_file: ./rules/tool_output.toml        # resolved relative to **this config file's directory** (not the CWD)
      on_failure: passthrough                     # rule load/execution failure → fall back to the original text (spec §8 fail-safe)
      # Rules may declare `tee` (spec §4.4); but v0.1 provides **no** on-disk
      # directory for originals and no retrieval channel — spec §4.4 already
      # marks both as unimplemented (deferred until after D3), so keys like
      # tee_dir deliberately **do not appear** in this file.

  - id: judge-experiment
    kind: process                                 # tier-B: out-of-process plugin (with module-level HMR)
    url: unix:///tmp/vadis-plugins/judge.sock
    inject: [cache_ledger, session_table]         # dependency declaration (coeffect, spec §4.3): unmet → stays in a loading wait
                                                  #   service names are product-defined typed slot names, not arbitrary strings
    isolate: false                                # true = separate realm: another set of bindings for the same services,
                                                  #   used to run two versions of one policy side by side for shadow comparison (ADR-002)
    intercept: { sample: 0.05, shadow: true }     # changes no bindings, only "how they are used": 5% sampling, shadow produces no output
    disabled: true                                # off by default; enabling it for experiments changes no product code

fallback:
  # Ordered route list at global granularity (schema in spec §4.2; v0.1 has no
  # per-model/per-alias chains).
  # Semantics: on upstream 5xx / 429 / quota exhaustion, switch in order to
  # "the next route not yet tried"; switching loses the prefix cache, so the
  # trace must record `failover_from` and the resulting re-prefill cost
  # (spec §6 "outcome" / DESIGN §5).
  # Chain exhausted → 502 upstream_error (upstream attempt timeout → 504
  # upstream_timeout); error body per spec §8.
  - deepseek/deepseek-v4-pro
  - kimi/kimi-k3
  - zai/glm-5.3

plan_policy:
  # spec §4.6 / ADR-014 — the subscription first, the metered account as the
  # spill. Optional, and **at most one** in v0.1 (a second family is an additive
  # future key, never a reshaped section). The keys and this example land
  # together (GAP-Q15): `deny_unknown_fields` makes an example that carries a key
  # the parser does not know an unservable file.
  family: glm-5.3                    # required: the model id both routes carry — and the key of the family's state.
                                    #   Both entries declare `family: glm-5.3` explicitly (§4.8; kept through the
                                    #   2026-09-21 → 2026-09-22 `[1m]` → bare id round-trip, R16-1) so the pairing
                                    #   does not depend on id equality.
  primary: zai-plan/glm-5.3         # required: a roster route whose provider is `account: coding_plan`. The id is
                                    #   the bare upstream-native form again (R16-1 revert, 2026-09-22): `[1m]` is a
                                    #   client-side switch the upstream refuses as an id (400 [1211], measured).
  overflow: zai/glm-5.3              # required: a distinct roster route whose provider is `account: api`. For a request inside
                                     #   this family it is the first candidate after `primary`, before the `fallback` list above (§4.2)
  on_primary_exhausted: spill        # spill | block (default spill). spill: the family continues on the metered account at its
                                     #   real price. block: the request is refused with `quota_exceeded` (429, §8) instead of being
                                     #   served from the metered account.
  recover: probe                     # probe | none (default probe). probe: after the cooldown the first request of a new session
                                     #   tries the plan again, and a success is recorded. none: no automatic probe — the family
                                     #   returns at the plan's own window boundary, or by an operator action.
  cooldown: 15m                      # default 15m: the floor between the move away from `primary` and the first admitted probe
  # overflow_monthly_cap_usd: 20.0   # optional: a ceiling on this family's **metered** spend in a UTC calendar month, compared
                                     #   against measured usage priced by this file's table. Once reached, the family's overflow
                                     #   requests are refused with `cost_cap_exceeded` (403, §8). The request that crosses the
                                     #   ceiling is served (its cost cannot be known beforehand), so the overshoot is at most one
                                     #   request. Absent = no cap; commented out here on purpose — the shipped example imposes none.
  # A plan's `quota` is a warning, not the authority (spec §4.6 rule 3, GAP-Q1):
  # only an upstream `403 quota_exhausted` moves the account, and it may defer a
  # probe until the plan's own window boundary has passed. Neither plan entry in
  # this file carries a `quota` block today — both vendors publish their
  # allowance in a shape that is not a monthly token count (spec §4.0, GAP-Q17),
  # so the key is demonstrated by `docs/spec.md` §4.6 and not by this roster.
  # overflow_selection: cheapest        # declared | cheapest …

# spec §4.6's other key lives on the provider entries above, not here:
# `account: coding_plan | api` (absent ⇒ api) — see `zai-plan` and
# `kimi-plan`. Operators who want no speculative attempt at all write
# `recover: none` above instead.
