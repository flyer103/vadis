    supports: [anthropic, chat, responses]
    account: coding_plan
    models:
      - id: k3                                    # the coding endpoint's flagship native id (the same id the CN coding
        family: kimi-k3                           #   entry sends); the tag pairs it with kimi/kimi-k3 above — two
                                                  #   different native ids, one family (§4.8). A client never writes
                                                  #   the tag; it is not an address.
        context: 1m                               # official: the coding docs publish the context window **per
                                                  #   membership tier** — k3: 262,144 at Plus/Moderato, 1,048,576 at
