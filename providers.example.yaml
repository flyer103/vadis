  - name: kimi
    # Renamed from `moonshot` (ADR-018 §3's one-time correction): a provider
    # name that disagrees with its own `api_key_env` (KIMI_*) is the mismatch
    # an operator sees on the first /health read. The naming convention is
    # documentation, not a load rule.
    region: intl                           # §4.8: api.moonshot.ai; prices in USD from platform.moonshot.ai
    currency: USD                          #   (the platform's pages answer on the kimi.ai host family today —
                                           #    a 301 measured in R6; the endpoint host is unchanged, and the
                                           #    pricing page now serves on platform.kimi.ai — verified 2026-09-21)
    urls:
        # source: https://platform.kimi.ai/docs/api/overview @2026-09-21 ("Protocol
        #   Compatibility": OpenAI Chat and OpenAI Responses both live at /v1,
        #   Anthropic Messages at /anthropic)
      chat:      https://api.moonshot.ai/v1/chat/completions
      responses: https://api.moonshot.ai/v1/responses
