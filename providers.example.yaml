          input_hit: 0.0003                       #   table must still be non-zero, spec §4.0). source as on
          cache_write: 0.003                      #   kimi/kimi-k3: https://platform.kimi.ai/docs/pricing/chat @2026-09-21
          output: 0.015                           #   (5-minute TTL tier for the cache write, the page's default)
          peak: { multiplier: 1.0, windows: [] }
        source: "https://platform.kimi.ai/docs/pricing/chat @2026-09-21"
        # TODO verify against official source: the coding endpoint publishes **no** price table of its own — the
        #   figures above are the open platform's, carried so the tier is non-zero (spec §4.0); the plan's real
        #   cost is the subscription plus the membership's usage windows (see below).
      # ---- 2026-09-21 second pass: the plan hands out FOUR model ids, not one
