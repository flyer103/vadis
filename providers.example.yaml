    # membership entitlement) serves k3 / k3-256k / kimi-for-coding /
    # kimi-for-coding-highspeed, while the **open platform** endpoint above serves
    # kimi-k3 / kimi-k2.7-code. This entry is the coding account, so it addresses
    # the coding endpoint and uses the coding endpoint's own id; the pair below the
    # CN entries (kimi-cn-plan/k3 + kimi-cn/kimi-k3) demonstrates the §4.8 family
    # tag that pairs two different native ids, and this intl pair now does the same.
    urls:                                    # **corrected 2026-09-21 (second pass)**: the coding endpoint serves
                                             #   BOTH forms, so both cells are declared — each with its own URL,
                                             #   which is exactly what `urls` exists to express
                                             #   source: https://www.kimi.com/code/docs/ @2026-09-21 ("服务地址"
                                             #   table: OpenAI 兼容 — intl https://api.kimi.ai/coding/v1, CN
                                             #   https://api.kimi.com/coding/v1; Anthropic 兼容 — intl
                                             #   https://api.kimi.ai/coding/, CN https://api.kimi.com/coding/)
      anthropic: https://api.kimi.ai/coding/v1/messages
      chat:      https://api.kimi.ai/coding/v1/chat/completions
      responses: https://api.kimi.ai/coding/v1/responses
                                              #   **added 2026-10-06 (ADR-051 §2.5.1)**: the coding service's
                                              #   Responses cell — source: https://www.kimi.com/code/docs/third-party-tools/codex
                                              #   @2026-10-06 (「Kimi Code 服务端原生支持 OpenAI Responses API（流式/非流式、
                                              #   reasoning、function calling 均可用）」), whose overseas configuration is
                                              #   base_url = "https://api.kimi.ai/coding/v1" with wire_api = "responses";
                                              #   the base agrees with https://www.kimi.com/code/docs/ @2026-10-06 (服务地址
                                              #   table: OpenAI 兼容 — intl https://api.kimi.ai/coding/v1)
    api_key_env: KIMI_CODING_API_KEY               # see the KIMI_* naming note on the metered kimi entry above
    wire_api: anthropic                           # the form this entry treats as native (the shape the plan's own
                                                  #   tooling, Claude Code, speaks). The `chat` cell is served by
                                                  #   translation to it (spec §2's lossy list). The vendor documents
                                                  #   both forms, so a client that speaks the OpenAI form should flip
