providers:
  # One roster entry per provider; `wire_api` = that provider's **native** wire
  # format (the condition for native passthrough).
  # `supports` = the set of inbound protocols the vadis can translate to it
  # (including wire_api itself) — the declared legal cells of the 3×3 matrix;
  # an undeclared cell = 400 (no "best-effort" translation). Translated cells
  # must handle the spec §2 lossy list item by item.
  # `urls` = one complete endpoint per declared cell (spec §4.9, ADR-020); the
  # two sets must be equal, and nothing is composed at request time.

  - name: deepseek
    region: intl                            # §4.8: the cited prices come from the platform's international
    currency: USD                           #   docs (api-docs.deepseek.com); no CN-mainland endpoint is configured
    urls:
        # source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21 — its
        #   "BASE URL (OpenAI Format)" is https://api.deepseek.com and its
        #   "BASE URL (Anthropic Format)" is https://api.deepseek.com/anthropic;
        #   each endpoint above is that base plus the form's own path,
        #   transcribed in full (ADR-020: the vadis appends nothing)
      chat:      https://api.deepseek.com/chat/completions
      responses: https://api.deepseek.com/responses
      anthropic: https://api.deepseek.com/anthropic/v1/messages
    api_key_env: DEEPSEEK_API_KEY                 # the key is read only from this env; no value in this file
                                                  #   the pool spelling is `api_keys: [ENV_A, ENV_B]`, in rotation order — exactly
                                                  #   one of this key OR that one (spec §4.6.1 / ADR-049). A pool rotates a
                                                  #   credential on 401 / 429 only; an upstream 403 quota_exhausted is a fact
                                                  #   about the *account*, never a bad key, so it moves the family and rotates
                                                  #   nothing. `vadis setup --check` reports one row per name in a pool.
    wire_api: responses                           # official docs explicitly support the Responses API (for the Codex scenario)
    supports: [chat, responses, anthropic]        # all three wire formats are officially documented (Responses API / Anthropic API),
                                                  #   and each carries its own URL above — so all three cells are reachable
                                                  #   (ADR-020: a declared cell with no endpoint is a load error, and no cell
                                                  #   here depends on the vadis appending anything)
    models:
      - id: deepseek-v4-pro
        context: 1m                               # official page: CONTEXT LENGTH = 1M (MAX OUTPUT 384K)
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21
        price:                                    # five-tier price, USD / 1K tokens (= official /1M ÷1000)
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21 (PRICING rows)
          input_miss: 0.00066                     # official $0.66 /1M (off-peak); peak $1.32 /1M
          input_hit: 0.000022                     # official $0.022 /1M (off-peak); peak $0.044 /1M
          cache_write: 0.0                        # the page publishes no separate cache-write item (spec §4.0: only hit/miss) → 0
          output: 0.00198                         # official $1.98 /1M (off-peak); peak $3.96 /1M
          peak:
            multiplier: 2.0                       # official: "Off-peak rates are half of the peak rates", hence multiplier = 2.0
            windows:                              # official: "Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC, Monday through Friday (all other hours are off-peak)"
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
              # known deviation: Chinese public holidays count as off-peak per the official policy; v0.1 does not model a holiday calendar (DESIGN §12.9 Q6)
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — context, the four tiers and the two peak windows
        #   all match this page; the version label it publishes today is DeepSeek-V4-Pro-0813 (no id change).
      - id: deepseek-flash
        context: 1m                               # official: CONTEXT LENGTH = 1M, MAX OUTPUT 384K — same row as the pro entry
                                                  #   source: https://api-docs.deepseek.com/quick_start/pricing @2026-09-21
        price:
          input_miss: 0.00015                     # official $0.15 /1M (off-peak); peak $0.30 /1M
          input_hit: 0.000003                     # official $0.003 /1M (off-peak); peak $0.006 /1M
          cache_write: 0.0
          output: 0.0006                          # official $0.6 /1M (off-peak); peak $1.2 /1M
          peak:
            multiplier: 2.0
            windows:
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "01:00", to: "04:00", tz: UTC }
              - { days: [Mon, Tue, Wed, Thu, Fri], from: "06:00", to: "10:00", tz: UTC }
        source: "https://api-docs.deepseek.com/quick_start/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the id is the page's current name; the legacy
        #   names (deepseek-v4-flash, deepseek-v4-flash-vision-exp) are accepted but retired, and this entry uses
        #   the current one. The page also lists Vision for Flash and not for the pro model — not modelled here.

  # The subscription account. spec §4.6: `account` is a property of the *entry*
  # (the key, the endpoint and the allowance belong to the account), so one
  # model id appears once per account and the two entries differ in urls,
  # wire_api and key. `plan_policy` at the end of this file names the pair.
  - name: zai-plan
    region: intl                           # §4.8: api.z.ai, prices in USD from docs.z.ai
    currency: USD
    urls:
        # source: https://docs.z.ai/devpack/quick-start @2026-09-21 ("Endpoint Guide" — three protocols, not one):
        #   Anthropic Messages   = api.z.ai/api/anthropic
        #   OpenAI Chat Complete = api.z.ai/api/coding/paas/v4   ← the plan's own path, not the metered /paas/v4
        #   OpenAI Responses     = api.z.ai/api/v1
        #   cross-checked on https://docs.z.ai/devpack/latest-model @2026-09-21 ("Before You Start" repeats all three)
      anthropic: https://api.z.ai/api/anthropic/v1/messages
      chat:      https://api.z.ai/api/coding/paas/v4/chat/completions
      responses: https://api.z.ai/api/v1/responses
    api_key_env: ZAI_CODING_API_KEY                 # the plan's key — a separate env var, because it is a separate account
    wire_api: anthropic                           # coding plans are usually handed out in the Anthropic format (the Claude Code shape)
    supports: [anthropic, chat, responses]
        # all three cells the plan's Endpoint Guide publishes. **Added 2026-09-21**: earlier revisions declared
        #   `anthropic` alone, which understated the plan — the same page (and the model-switch guide) lists the
        #   OpenAI Chat and OpenAI Responses bases too, and each is a complete URL now, so none has to be guessed.
    account: coding_plan                          # coding_plan | api (absent ⇒ api)
                                                  #   this entry is NOT the family's only plan. `zai-cn-plan` below carries the
                                                  #   same `family: glm-5.3` tag, so family `glm-5.3` has a **two-member plan
                                                  #   tier**: `plan_policy.primary` starts the walk here and the second member is
                                                  #   drained before any metered money is spent (ADR-049 §5.1). A family whose tag
                                                  #   one `coding_plan` entry alone carries is a one-member tier — the pre-ADR-049
                                                  #   shape. This roster holds none: every tag it declares is carried by two
                                                  #   `coding_plan` entries, so no one-member tier is shown here.
    models:
      - id: glm-5.3                               # the upstream-native id — REVERTED 2026-09-22 (R16-1): `glm-5.3[1m]` is
                                                  #   refused 400 [1211] 模型不存在 on every plan wire (anthropic / chat /
                                                  #   responses, on both api.z.ai and open.bigmodel.cn, measured 2026-09-22),
                                                  #   while the bare id returns 200 on all six. A MITM capture of Claude Code
                                                  #   2.1.251 invoked with `--model glm-5.3[1m]` shows the client itself strips
                                                  #   the suffix and sends `model: "glm-5.3"` with the `context-1m-2025-08-07`
                                                  #   beta header — `[1m]` is a client-side switch, not a server-side model
                                                  #   identity. This narrows the 2026-09-21 operator decision (option A),
                                                  #   which read the plan pages' Claude-Code sections as server-side ids, to:
                                                  #   no wire of this provider carries the suffix. The pages scope it
                                                  #   themselves: 「开启 GLM 1M 上下文需要模型后缀加上 [1m]」 sits under 在
                                                  #   Claude Code 中切换, while the same page's Cline section tells OpenAI-
                                                  #   compatible tools to enter 「glm-5.3 或 glm-5.3-flash」 and set the
                                                  #   context window client-side (docs.bigmodel.cn/cn/coding-plan/latest-model
                                                  #   @2026-09-22; docs.z.ai/devpack/latest-model @2026-09-22, same shape).
                                                  #   Route id: `zai-plan/glm-5.3`; the `glm-plan` alias is unchanged in
                                                  #   meaning (see `aliases` below).
        family: glm-5.3                            # explicit (§4.8): pairs this route with the metered `zai/glm-5.3`, so
                                                  #   plan_policy.family below matches both sides (kept explicit through the
                                                  #   2026-09-21 → 2026-09-22 id round-trip; absent would default to the id).
        context: 1m                               # **corrected 2026-09-21** (was 200k): the model page states a 1M-token context
                                                  #   window and says GLM-5.3 "is now available to all GLM Coding Plan users"
                                                  #   source: https://docs.z.ai/guides/llm/glm-5.3 @2026-09-21 (MAX OUTPUT 128K)
        price:                                    # the same model's official list price as the metered entry, same source:
          input_miss: 0.0014                      #   inside the plan the marginal price is accounted **0** (spec §4.6 rule 4);
          input_hit: 0.00026                      #   the table still has to be non-zero, because a zero tier is a load error (spec §4.0)
          cache_write: 0.0
          output: 0.0044
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — GLM-5.3 $1.4 / $0.26 cached / storage "Limited-time
        #   Free" / $4.4 per 1M, no peak/off-peak published ⇒ multiplier 1.0, windows empty.
      # ---- 2026-09-21 second pass: the plan serves TWO models, not one —
      #   "The GLM Coding Plan now supports the latest GLM-5.3 and GLM-5.3-Flash models for all users
      #   (Max, Pro, and Lite)" (docs.z.ai/devpack/latest-model @2026-09-21).
      - id: glm-5.3-flash                          # upstream-native id — REVERTED 2026-09-22 (R16-1), same evidence as the
                                                  #   glm-5.3 entry above: `glm-5.3-flash[1m]` → 400 [1211] on all plan wires,
                                                  #   bare → 200 (measured on every wire incl. CN anthropic, R13-LAND + R16-1).
                                                  #   Route id: `zai-plan/glm-5.3-flash`; clients use `glm-plan-flash`.
        family: glm-5.3-flash                      # explicit (§4.8): the tag keeps pairing the route with the
                                                  #   metered `zai/glm-5.3-flash` (id and tag now equal again; kept explicit).
        context: 1m                               # plan model; 1M is enabled client-side (Claude Code's `[1m]` suffix or the
                                                  #   client's context-window setting) — not part of the wire id (R16-1).
        price:                                    # shadow = the metered list price of the same model; marginal price
          input_miss: 0.00015                     #   inside the plan is accounted 0 (spec §4.6 rule 4)
          input_hit: 0.00003
          cache_write: 0.0
          output: 0.0005
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
    # no `quota:` — **removed 2026-09-21** (it carried a 100,000,000-token placeholder) because spec §4.0's last
    # bullet is explicit: `quota` states a *token* allowance on a monthly window and nothing else, and a plan whose
    # vendor publishes a different shape carries **no** block. GLM Coding Plan publishes credits, not tokens:
    #   * a 5-hour and a weekly credit allowance, both per plan tier
    #     (https://docs.z.ai/devpack/teamplan @2026-09-21, "Usage Credit Allowance" table + "Credit Reset Rules"):
    #     the 5-hour credits refresh 5 hours after consumption, the weekly ones every 7 days from subscription;
    #   * the deduction formula: model credits = (input × input multiplier + cached input × cached-input multiplier +
    #     output × output multiplier) / 10,000; off-peak usage is charged at **50%** of the standard credit rate, so
    #     the token allowance is a range whose ends are "all off-peak" and "all peak" (both stated on that page);
    #   * the plan's price ("from $18/month") is on https://z.ai/subscribe; the vendor publishes no token count for it.
    # The upstream remains the only authority on exhaustion (spec §4.6 rule 3, GAP-Q17 / DESIGN §12.9). Point a
    # client at the plan and let it tell you; do not derive a verdict from a number nobody published.

  - name: zai
    region: intl                           # §4.8: api.z.ai. The same vendor's CN-mainland entries
    currency: USD                          #   (zai-cn / zai-cn-plan) sit below — two regions, two currencies
    urls:
        # source: https://docs.z.ai/api-reference/llm/chat-completion @2026-09-21
        #   (OpenAPI: server https://api.z.ai/api + path /paas/v4/chat/completions)
      chat:      https://api.z.ai/api/paas/v4/chat/completions
      anthropic: https://api.z.ai/api/anthropic/v1/messages
    api_key_env: ZAI_API_KEY
    wire_api: chat
    supports: [chat, anthropic]
        # two cells, and their provenance is not the same — the API reference on this very page documents Chat
        #   Completions only: "server https://api.z.ai/api + path /paas/v4/chat/completions". The Anthropic-compatible
        #   base on this same host is published on the GLM **Coding Plan** pages instead
        #   (https://docs.z.ai/devpack/quick-start, "Endpoint Guide": api.z.ai/api/anthropic) @2026-09-21 — that is
        #   also where the plan's other two cells are declared, on `zai-plan` below. A metered key against
        #   /api/anthropic is therefore NOT independently documented; **kept deliberately** (operator decision,
        #   2026-09-21) rather than dropped, so that the provenance above — not the cell — is what a reviewer has
        #   to weigh. Deleting the cell is a one-line change if a metered key is ever seen to 404 there.
                                                  #   undocumented formats are not declared (better missing than guessed: undeclared = 400)
                                                  # the anthropic cell is reachable at its own documented base because this entry
                                                  #   states both endpoints in full (ADR-020): the two cells no longer share a
                                                  #   field, and neither is a known deviation any more
    models:
      - id: glm-5.3
        context: 1m                               # **corrected 2026-09-21** (was 200k): "a 1M-token context window",
                                                  #   MAX OUTPUT 128K, text-only
                                                  #   source: https://docs.z.ai/guides/llm/glm-5.3 @2026-09-21
        price:
          input_miss: 0.0014                      # official $1.4 /1M
          input_hit: 0.00026                      # official $0.26 /1M
          cache_write: 0.0                        # official "Cached Input Storage: Limited-time Free" (free for a limited period)
          output: 0.0044                          # official $4.4 /1M
          peak: { multiplier: 1.0, windows: [] }  # no peak/off-peak published officially → same price at all times
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the four figures above and "Limited-time Free"
        #   storage are unchanged; the rules after the storage promotion ends are still unpublished.
      - id: glm-5.3-flash
        context: 1m                               # **corrected 2026-09-21** (was 200k): "Context Length 1M", MAX OUTPUT 128K
                                                  #   source: https://docs.z.ai/guides/vlm/glm-5.3-flash @2026-09-21
        price:
          input_miss: 0.00015                     # official $0.15 /1M list price (a 50% promotion listed $0.075 /1M)
          input_hit: 0.00003                      # official $0.03 /1M list (promotion $0.015 /1M)
          cache_write: 0.0
          output: 0.0005                          # official $0.50 /1M list (promotion $0.25 /1M)
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the list prices are the ones recorded; the
        #   pricing page states the 50% promotion "ends at 24:00 on September 9, 2026 (UTC+8, Singapore time)".
      - id: glm-4.7
        context: 200k                             # source: https://docs.z.ai/guides/llm/glm-4.7 @2026-09-21
                                                  #   ("Context Length 200K", MAX OUTPUT 128K) — re-read, unchanged
        price:
          input_miss: 0.0006                      # official $0.6 /1M
          input_hit: 0.00011                      # official $0.11 /1M
          cache_write: 0.0
          output: 0.0022                          # official $2.2 /1M
          peak: { multiplier: 1.0, windows: [] }
        source: "https://docs.z.ai/guides/overview/pricing @2026-09-21"
        # TODO verify against official source: re-read 2026-09-21 — the pricing page still lists GLM-4.7 in its
        #   "Text Models" table at these figures; the model page is still published (context 200K re-confirmed).
      # ---- 2026-09-21 second pass: the rest of this account's metered CHAT roster.
      #   prices: https://docs.z.ai/guides/overview/pricing | contexts: https://docs.z.ai/guides/overview/overview
      #   (GLM-4.6V rows: https://docs.z.ai/guides/vlm/glm-4.6v). Cross-checked against the vendor's own
      #   model catalogue on the same pages. Excluded, each with the reason:
      #     * GLM-4.7-Flash / GLM-4.5-Flash / GLM-4.6V-Flash — the vendor's price is "Free" and a zero
      #       tier is refused at load, so a $0 model cannot be expressed in the roster at all
      #     * GLM-OCR — priced under Vision Models, but its guide serves it from /paas/v4/layout_parsing,
      #       not from chat completions: there is no chat cell to route
