        source: "https://www.kimi.com/code/docs/ @2026-09-21"
        # shadow = the metered list price of the model the vendor names it after
        #   (K2.7 Code HighSpeed, https://platform.kimi.ai/docs/pricing/chat-k27-code) — a documented mapping, not a guess.
