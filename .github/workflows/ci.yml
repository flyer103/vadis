# The four gates this repository grades itself on (AGENTS.md "Commands"), run on every push
# and every pull request. They are exactly the local commands, in the same order, so a green
# run here means a green run there.
#
# - no secret is referenced anywhere in this workflow
# - the job needs no repository write access
# - the toolchain is pinned by `rust-toolchain.toml` in the repository root
# - the cache is an optimisation only: a cold cache changes the run time, not the verdict
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact compiler plus the clippy/rustfmt components;
      # rustup installs that version here. Doing it in its own step keeps a toolchain
      # problem visibly separate from a build problem.
      - name: Install the pinned toolchain
        run: rustup show

      - name: Report the compiler actually in use
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The workspace builds one debug test binary per conformance case (55 of them at the
      # time of writing) and each link pulls ~150 rlibs. On the default runner that exhausts
      # the free space and `ld` dies mid-link with SIGBUS: observed twice in run 35543405184,
      # attempt 1 failing on `conf_27_outbound_model_native_id` and attempt 2 on
      # `conf_24_trace_event_join` — a different target each time, which is the signature of
      # resource exhaustion rather than a build error. None of these SDKs is used by this
      # build; removing them frees roughly 20 GB. No gate command is touched, and
      # `/opt/hostedtoolcache` is left alone because the pinned Rust toolchain lives there.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift \
                      /usr/local/share/boost /usr/local/share/vcpkg /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      # `target/` plus the cargo registry: without this a cold run rebuilds every dependency,
      # including the bundled SQLite C library that rusqlite compiles.
      - name: Restore the cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # TEMPORARY R53-0 DIAGNOSTIC — removed before this branch's final commit.
      - name: "DIAG r53-0: disk after cache restore"
        run: |
          df -h /
          du -sh target 2>/dev/null || echo "no target dir restored"
          du -sh ~/.cargo 2>/dev/null || true

      # tests/conformance is a workspace member, so the protocol matrix, the byte/prefix
      # invariants and the accounting convention run as part of this step.
      - name: cargo build --workspace
        run: cargo build --workspace

      # TEMPORARY R53-0 DIAGNOSTIC — removed before this branch's final commit.
      - name: "DIAG r53-0: disk after cargo build"
        run: |
          df -h /
          du -sh target
          du -sh target/debug/deps target/debug/incremental 2>/dev/null || true

      - name: cargo test --workspace --no-fail-fast
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace -- -D warnings

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      # TEMPORARY R53-0 DIAGNOSTIC — removed before this branch's final commit.
      # Runs even after a gate failure so the post-mortem disk state is captured.
      - name: "DIAG r53-0: disk at end (always)"
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          du -sh target/debug/deps target/debug/incremental 2>/dev/null || true
