# The four gates this repository grades itself on (AGENTS.md "Commands"), run on every push
# and every pull request. They are exactly the local commands, in the same order, so a green
# run here means a green run there.
#
# - no secret is referenced anywhere in this workflow
# - the job needs no repository write access
# - the toolchain is pinned by `rust-toolchain.toml` in the repository root
# - the cache is an optimisation only: a cold cache changes the run time, not the verdict
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # R53-0: debug info is not part of any gate verdict — no test reads DWARF (the only
  # debug_assert! users are controlled by `debug-assertions`, which stays on), and
  # RUST_BACKTRACE still resolves function names from the symbol table. At the dev
  # defaults (debug=2 + incremental) the 76 conformance test binaries plus ~150 rlibs
  # each grew target/ to 35 GB on the runner and exhausted the disk (measured:
  # run 36299293578, autowork/harness/r53-0/RUN1-DIAGNOSTIC.md). Turning DWARF and
  # incremental off is what makes the build fit; it changes build artifacts, never
  # verdicts.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"

jobs:
  gates:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact compiler plus the clippy/rustfmt components;
      # rustup installs that version here. Doing it in its own step keeps a toolchain
      # problem visibly separate from a build problem.
      - name: Install the pinned toolchain
        run: rustup show

      - name: Report the compiler actually in use
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The workspace builds one debug test binary per conformance case (76 of them at the
      # time of writing) and each link pulls ~150 rlibs. On the default runner that exhausts
      # the free space and `ld` dies mid-link with SIGBUS: observed twice in run 35543405184,
      # attempt 1 failing on `conf_27_outbound_model_native_id` and attempt 2 on
      # `conf_24_trace_event_join` — a different target each time, which is the signature of
      # resource exhaustion rather than a build error — and again in run 36299293578 on
      # `conf_46_metrics_is_bare_404` / `conf_39_cooldown_testable`. None of these SDKs is
      # used by this build; removing them frees roughly 20 GB. No gate command is touched,
      # and `/opt/hostedtoolcache` is left alone because the pinned Rust toolchain lives
      # there.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift \
                      /usr/local/share/boost /usr/local/share/vcpkg /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      # The cargo registry only, deliberately WITHOUT `target` (R53-0). A warm target/
      # for this workspace is 25-35 GB: run 36299293578 measured the cache restoring a
      # complete 25 GB tree (a 6 GB archive, under the 10 GB cap), which left the runner
      # 10 GB of headroom that cargo test then exhausted. The registry alone is hundreds
      # of MB — the cache stays what the header says it is: an optimisation that changes
      # run time, never the verdict. The key carries a `v2` namespace so a stale archive
      # saved WITH target/ under the old `cargo-` prefix can never be restored here.
      - name: Restore the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-

      # tests/conformance is a workspace member, so the protocol matrix, the byte/prefix
      # invariants and the accounting convention run as part of this step.
      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace --no-fail-fast
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace -- -D warnings

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
